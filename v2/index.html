<style>
/* Layout: scoreboard, today-actions panel, then tabs (戰況 / 陣容與增補 / 消息 / 更新紀錄). */

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #17202c; --surface-2: #202b3a; --fg: #e8edf4; --muted: #96a2b4; --line: #2b3748;
    --accent: #7c9bff; --accent-soft: #1f2d5c; --good: #4cc98a; --good-soft: #14352a; --warn: #e5b34d; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3e1d1b;
    color-scheme: dark;
  }
}

  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;

.games { display: flex; flex-wrap: wrap; gap: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.scroll { overflow-x: auto; }

td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }

td.name { font-weight: 500; white-space: nowrap; }

.fp { font-family: var(--font-display); font-size: 18px; font-weight: 700; }

.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }

.c-ok { background: var(--good-soft); color: var(--good); }
.c-watch { background: var(--warn-soft); color: var(--warn); }
.c-drop { background: var(--bad-soft); color: var(--bad); }

.t-ok { background: var(--good-soft); color: var(--good); }

<script>
(function () {
  var KEY = 'aespa_pw_ok', HASH = '5b3e022e34d6d19915e553c35c2ae4c71c12f15e5d63c19c494f787de5ce787c';
  function sha256(s) { var enc = new TextEncoder().encode(s); return crypto.subtle.digest('SHA-256', enc).then(function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }); }
  function unlock() { document.body.classList.remove('locked'); document.getElementById('pwgate').classList.add('off'); }
  // skip the password gate when not served from the public GitHub Pages site (e.g. this Artifact preview) — Leo doesn't need a password for his own private Artifact
  var isPublicSite = /(^|\.)github\.io$/.test(location.hostname);
  if (!isPublicSite) { unlock(); }
  else { try { if (sessionStorage.getItem(KEY) === HASH) { unlock(); } else { document.body.classList.add('locked'); } } catch (e) { document.body.classList.add('locked'); } }
  var inp = document.getElementById('pwin'), btn = document.getElementById('pwok'), err = document.getElementById('pwerr');
  function tryGo() {
    sha256(inp.value || '').then(function (h) {
      if (h === HASH) { try { sessionStorage.setItem(KEY, HASH); } catch (e) {} unlock(); }
      else { err.textContent = '密碼錯誤'; inp.value = ''; inp.focus(); }
    });
  }
  btn.addEventListener('click', tryGo);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryGo(); });
})();
</script>

寫(純內部整理,畫面無任何變化)"]},{"v":"v2.17","date":"11/8","items":["待辦重寫:移除已過期的「週日對手追分」「週六日陣容確認」等舊項目,保留 11/9 換人建議與 Quickley DTD 提醒;逐日重讀 ESPN 11/7、11/8 陣容(Quickley DTD,Morant、Leonard 仍 OUT)","asof 更新;賽後摘要、球員評語、聯盟成員判斷、潛力發掘、傷兵清單本次沿用舊內容(未重讀)"]},{"v":"v2.16","date":"11/8","items":["右上角新增「⚡ 立即更新」按鈕:按下去直接對 ESPN 現場查詢(不經過排程、不等 GitHub Actions),立刻刷新「今天的比賽」即時比分,並重新抓本週剩餘日子雙方的即時陣容來更新「本週對戰」表格的場次數字,解決對手臨時交易/換人時畫面沒跟上的問題;預估得分、爆走爆胎榜等需要疊加歷史數據的區塊仍沿用排程結果"]},{"v":"v2.15","date":"11/8","items":["每日爆走／爆胎榜:改成只顯示前 5 名,第 6–10 名收進可展開區塊;每筆加上橫向長條圖(跟當天最大落差的相對比例),一眼看出差距大小","新增「上週戰報」(決策分頁最上面):每次新的一週開始,把上一週的終局比分、爆走/爆胎常客(整週出現 2 次以上的人)都存下來,方便規劃這週的策略;修正爆走/爆胎週累計之前會因為同一天跑好幾次更新被重複計數的問題,現在改成每個行事曆日只算一次"]},{"v":"v2.14","date":"11/8","items":["新增「戰況」分頁的「每日爆走／爆胎榜」:每天賽後,把所有球員(聯盟陣容+前段自由球員)的實際得分跟自己的預期基準(今年平均,樣本不足改用去年或近 15 場)比,抓出落差最大的 10 個爆走跟 10 個爆胎,只看預期值至少 10 分的人避免雜訊干擾;同時累計本週出現 2 次以上的球員,自動寫一句短評(例如連續爆走代表上場時間在增加,連續爆胎可能狀態或角色有變化)"]},{"v":"v2.13","date":"11/8","items":["新增「決策」分頁的「本週對手 Streaming 防範」(可折疊):針對你發現的對手手法——球員今天場次打完就丟、改抓明天有比賽的自由球員——列出他陣容裡本週已無場次的板凳球員,以及自由市場明天有比賽、數值不錯的候選人,方便你搶先卡位","「消息」分頁預留「專業分析觀點」區塊位置(目前先空著,等有核對過日期的內容再放,避免放到舊賽季的過期文章)"]},{"v":"v2.12","date":"11/8","items":["新增「傷兵解除卻坐板凳」提醒:build.mjs 每次更新會記住上一次每位球員的傷病狀態,發現有人從 DTD/OUT 變成健康、但還在板凳時,會在頁首的急事橫幅提醒你,跟原本「先發變 OUT」的提醒合併顯示","修正「下週對手」卡片的主力球員表格在手機版最後一欄被切掉的問題,改成跟傷病追蹤一樣的清單排版"]},{"v":"v2.11","date":"11/8","items":["早間出賽確認:ESPN 比賽日 11/7(美東)。替補(Klay、Garland、Quickley)今天都沒有比賽,IR 的 Morant、Kawhi 仍是 OUT,先發 10 人全是 ACTIVE,沒有需要換人的球員。Quickley 由 OUT 轉為 DTD(預計 11/9 回歸),已更新傷兵清單。"]},{"v":"v2.10","date":"11/8","items":["「下週對手分析」跟「下週勝率預測」接上真正的後端計算:build.mjs 每次更新時會重新抓下週對手的陣容、戰績、主力球員預估,並用跟本週一樣的方法(逐日預估 + 標準差換算)算出下週勝率,不再是凍結的舊資料","下週沒有對手(賽季末段)時這兩個區塊會自動留白,不會顯示錯誤或舊數字"]},{"v":"v2.9","date":"11/8","items":["修正分數錯誤:「應對策略」卡與「本週勝率預測」原本讀取的 D.insights.win 從來沒有被 build.mjs 重新計算過,是凍結在功能剛做好那次的舊分數——已改成用跟「今天要做的事」同一份、每次都會更新的本週逐日預估重新算過,分數會跟頁首比分一致","「下週對手分析」跟「下週勝率預測」發現也是同樣問題(讀取同一份從沒更新過的舊資料),暫時收回隱藏,比顯示錯的數字安全,之後要做乾淨的版本再上"]},{"v":"v2.8","date":"11/8","items":["網站大整理:分頁從 7 個併成 5 個(功能測試的滾動趨勢/交易分析器/背靠背疲勞/位置稀缺度/戰力排名/未來對手, (function () {
  var tb = document.getElementById('rost'); if (!tb) return;
  var body = tb.tBodies[0], state = { k: null, dir: 0 };
  var ths = tb.querySelectorAll('th.sortable');
  function apply() {

    if (state.dir === 0) rows.sort(function (a, b) { return a.getAttribute('data-i') - b.getAttribute('data-i'); });
    else rows.sort(function (a, b) {
      var x = parseFloat(a.getAttribute('data-s').split('|')[state.k]), y = parseFloat(b.getAttribute('data-s').split('|')[state.k]);
      if (isNaN(x)) return 1; if (isNaN(y)) return -1; return state.dir * (y - x);
    });
    rows.forEach(function (r) { body.appendChild(r); });
    ths.forEach(function (t) { var on = state.dir !== 0 && +t.getAttribute('data-k') === state.k; t.classList.toggle('on', on); t.querySelector('i').textContent = on ? (state.dir === 1 ? '↓' : '↑') : '⇅'; });
  }
  ths.forEach(function (t) { t.addEventListener('click', function () { var k = +t.getAttribute('data-k'); if (state.k !== k) { state.k = k; state.dir = 1; } else state.dir = state.dir === 1 ? -1 : state.dir === -1 ? 0 : 1; apply(); }); });
  var D = JSON.parse(document.getElementById('data').textContent);

<script>
(function () { try {
  var D = JSON.parse(document.getElementById('data').textContent);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function f1(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1); }
  var LG = D.logs || {};
  var P = (D.cmp || []).map(function (l) { var a = l.split('|'); var n = function (i) { return a[i] === '' || a[i] == null ? null : +a[i]; };
    return { id: a[0], name: a[1], team: a[2], pos: a[3], own: a[4], inj: a[5], s27: n(6), l7: n(7), l15: n(8), s26: n(9), pct: n(12), chg: n(13), rest: n(14), next: n(15) }; });
  function est(p) { var v = [p.s27, p.l15].filter(function (x) { return x != null && !(p.s27 === 0 && p.l15 === 0); }); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; }
  function ownLabel(p) { return p.own === 'FA' ? '自由球員' : p.own === 'Waiver' ? 'Waiver' : p.own; }
  function plabel(p) { return p.name + '（' + ownLabel(p) + '）'; }
  var byLabel = {}; P.forEach(function (p) { byLabel[plabel(p)] = p; });

  // ---------- 1) rolling trend sparklines (your current roster) ----------
  (function () {
    var host = document.getElementById('v2trend'); if (!host) return;
    var mine = P.filter(function (p) { return p.own === 'aespa'; }).sort(function (a, b) { return (est(b) || 0) - (est(a) || 0); });
    var rows = mine.map(function (p) {
      var lg = LG[p.id]; if (!lg || !lg[8] || !lg[8].length) return null;
      var games = lg[8].slice().reverse(); // chronological
      var scores = games.map(function (g) { return g[2]; });
      var mx = Math.max.apply(null, scores.concat([1])), mn = Math.min.apply(null, scores.concat([0]));
      var rng = Math.max(mx - mn, 1);
      var bars = scores.map(function (s) { var h = Math.max(4, Math.round((s - mn) / rng * 26) + 2); var cls = p.s27 != null ? (s >= p.s27 ? 'up' : 'down') : ''; return '<i class="' + cls + '" style="height:' + h + 'px" title="' + f1(s) + '"></i>'; }).join('');
      var last = scores[scores.length - 1], diff = p.s27 != null ? last - p.s27 : null;
      return '<div class="trendrow"><div class="nm">' + esc(p.name) + '<small>' + esc(p.team) + ' · ' + esc(p.pos) + (p.inj ? ' · ' + esc(p.inj) : '') + '</small></div><div class="spark">' + bars + '</div><div class="diff ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '') + '">最近 ' + f1(last) + (diff == null ? '' : '(' + (diff >= 0 ? '+' : '') + f1(diff) + ')') + '</div></div>';
    }).filter(Boolean);
    host.innerHTML = '<h2>滾動趨勢<span class="label">你的陣容,近 10 場</span></h2>' + (rows.length ? rows.join('') : '<p class="note">暫無資料。</p>') + '<p class="note">長條是每場 fantasy 分數,由舊到新;綠色代表當場高於今年平均,紅色代表低於。右側是最近一場與今年平均的差。</p>';
  })();

  // ---------- 2) trade analyzer ----------
  (function () {
    var host = document.getElementById('v2trade'); if (!host) return;
    host.innerHTML = '<h2>交易分析器<span class="label">最多各 3 人</span></h2>' +
      '<datalist id="tdl">' + P.map(function (p) { return '<option value="' + esc(plabel(p)) + '">'; }).join('') + '</datalist>' +
      '<div class="tradebar"><div><h4>你送出</h4>' + [0, 1, 2].map(function (i) { return '<div class="tradeslot"><input class="tout" list="tdl" placeholder="球員 ' + (i + 1) + '" autocomplete="off"></div>'; }).join('') + '</div>' +
      '<div><h4>你收到</h4>' + [0, 1, 2].map(function (i) { return '<div class="tradeslot"><input class="tin" list="tdl" placeholder="球員 ' + (i + 1) + '" autocomplete="off"></div>'; }).join('') + '</div></div>' +
      '<div id="tradeOut"></div>';
    var outs = Array.prototype.slice.call(host.querySelectorAll('.tout'));
    var ins = Array.prototype.slice.call(host.querySelectorAll('.tin'));
    var out = document.getElementById('tradeOut');
    function posList(ps) { var s = {}; ps.forEach(function (p) { (p.pos || '').split('/').forEach(function (x) { if (x) s[x] = (s[x] || 0) + 1; }); }); return Object.keys(s).map(function (k) { return k + '×' + s[k]; }).join('、') || '—'; }
    function calc() {
      var A = outs.map(function (i) { return byLabel[i.value]; }).filter(Boolean);
      var B = ins.map(function (i) { return byLabel[i.value]; }).filter(Boolean);
      if (!A.length && !B.length) { out.innerHTML = '<p class="note">從清單選球員(各邊最多 3 人),我會算出雙方預估分數差。</p>'; return; }
      var sa = A.reduce(function (t, p) { return t + (est(p) || 0); }, 0), sb = B.reduce(function (t, p) { return t + (est(p) || 0); }, 0);
      var diff = sb - sa;
      var injB = B.filter(function (p) { return p.inj; });
      var verdict = Math.abs(diff) < 0.5 ? '兩邊預估差不多' : diff > 0 ? '對你划算' : '對你不划算';
      var cls = Math.abs(diff) < 0.5 ? '' : diff > 0 ? 'up' : 'down';
      out.innerHTML = '<div class="traderes"><div class="big ' + cls + '">' + (diff >= 0 ? '+' : '') + f1(diff) + ' 分/場</div><div>' + verdict + ',你送出合計預估 ' + f1(sa) + ',收到合計預估 ' + f1(sb) + '。</div>' +
        '<p class="note">位置變化:送出 ' + esc(posList(A)) + ' → 收到 ' + esc(posList(B)) + '。</p>' +
        (injB.length ? '<p class="note" style="color:var(--bad)">⚠ 收到的球員裡有傷:' + injB.map(function (p) { return esc(p.name) + '(' + esc(p.inj) + ')'; }).join('、') + '。</p>' : '') +
        '</div>';
    }
    outs.concat(ins).forEach(function (i) { i.addEventListener('input', calc); i.addEventListener('change', calc); });
    calc();
  })();

  // ---------- 3) back-to-back fatigue risk ----------
  (function () {
    var host = document.getElementById('v2b2b'); if (!host || !D.sch) return;
    function parseSched(str) {
      return (str || '').split(';').filter(Boolean).map(function (e) { var mm = e.split(':'); var dm = mm[0].match(/(\d+)\/(\d+)/); if (!dm) return null;
        var mo = +dm[1], da = +dm[2], yr = mo >= 10 ? 2026 : 2027; var d = new Date(Date.UTC(yr, mo - 1, da));
        return { label: dm[0], opp: (mm[1] || '').replace('@', '@'), date: d }; }).filter(Boolean);
    }
    var mine = P.filter(function (p) { return p.own === 'aespa'; });
    var teams = {}; mine.forEach(function (p) { if (p.team && D.sch[p.team]) teams[p.team] = (teams[p.team] || []).concat([p.name]); });
    var rows = [];
    Object.keys(teams).forEach(function (t) {
      var sch = parseSched((D.sch[t] || [])[1]);
      for (var i = 1; i < sch.length; i++) {
        var diffDays = Math.round((sch[i].date - sch[i - 1].date) / 86400000);
        if (diffDays === 1) rows.push({ team: t, names: teams[t], d1: sch[i - 1], d2: sch[i] });
      }
    });
    rows.sort(function (a, b) { return a.d1.date - b.d1.date; });
    host.innerHTML = '<h2>背靠背疲勞風險<span class="label">你陣容球員所在球隊,近期連兩天出賽</span></h2>' +
      (rows.length ? rows.map(function (r) { return '<div class="b2britem"><span>' + esc(r.names.join('、')) + '<br><small class="note">' + esc(r.team) + '</small></span><span>' + esc(r.d1.label) + esc(r.d1.opp) + ' → ' + esc(r.d2.label) + esc(r.d2.opp) + '</span></div>'; }).join('') : '<p class="note">近期沒有背靠背。</p>') +
      '<p class="note">背靠背(連續兩天出賽)對分數的實際影響,用這聯盟自己的資料回測過,看不出第二場會比較低分(甚至略高),所以不宜當成一定會變差;這裡單純標出有背靠背的人,是否要調整先發自行判斷。</p>';
  })();

  // ---------- 4) positional scarcity ----------
  (function () {
    var host = document.getElementById('v2scarcity'); if (!host) return;
    var FA = P.filter(function (p) { return (p.own === 'FA' || p.own === 'Waiver') && est(p) != null; });
    var POS = ['PG', 'SG', 'SF', 'PF', 'C'];
    var byPos = {}; POS.forEach(function (k) { byPos[k] = []; });
    FA.forEach(function (p) { (p.pos || '').split('/').forEach(function (k) { if (byPos[k]) byPos[k].push(p); }); });
    POS.forEach(function (k) { byPos[k].sort(function (a, b) { return est(b) - est(a); }); });
    var cards = POS.map(function (k) { var list = byPos[k], deep = list.filter(function (p) { return est(p) >= 15; }).length;
      return '<div class="scarcard"><h4>' + k + '<span class="cnt">' + deep + ' 人可補(≥15分)</span></h4><ul>' +
        list.slice(0, 3).map(function (p) { return '<li>' + esc(p.name) + '<span class="note"> ' + f1(est(p)) + '</span></li>'; }).join('') + (!list.length ? '<li class="note">目前沒有</li>' : '') + '</ul></div>'; }).join('');
    var rank = POS.map(function (k) { return { k: k, n: byPos[k].filter(function (p) { return est(p) >= 15; }).length }; }).sort(function (a, b) { return a.n - b.n; });
    host.innerHTML = '<h2>位置稀缺度<span class="label">自由市場各位置還有誰</span></h2><div class="scargrid">' + cards + '</div>' +
      '<p class="note">目前最難補的位置:' + rank.slice(0, 2).map(function (r) { return r.k + '(' + r.n + ' 人)'; }).join('、') + '。只計算自由球員與 waiver,多位置資格的球員會在每個位置都算到。</p>';
  })();

  // ---------- 5) playoff positioning + league power ranking / weekly trend chart ----------
  (function () {
    var host = document.getElementById('v2playoff'); if (!host || !D.v2 || !D.v2.standings) return;
    var V = D.v2, cut = V.playoffTeamCount || 8;
    var rows = V.standings.map(function (s, i) { var inPlayoff = s.projRank != null && s.projRank <= cut;
      return '<div class="standrow ' + (s.name === 'aespa' ? 'me' : '') + (i + 1 === cut ? ' cut' : '') + '"><span class="seed">' + (s.seed || (i + 1)) + '</span><span><b>' + esc(s.name) + '</b></span><span class="n">' + s.w + '-' + s.l + '</span><span class="n">' + s.pf + '</span><span class="chip ' + (inPlayoff ? 'c-ok' : 'c-drop') + '">ESPN預測第' + (s.projRank || '?') + '名</span></div>'; }).join('');
    function trendChart() {
      var tr = V.trend; if (!tr || !tr.weeks || !tr.weeks.length) return '';
      var opp = (D.insights && D.insights.win && D.insights.win.this && D.insights.win.this.opp) || null;
      var me = tr.scores['aespa'] || [], op = opp && tr.scores[opp] ? tr.scores[opp] : null, med = tr.median || [];
      var all = [].concat(me, med, op || []).filter(function (v) { return v != null; }); if (!all.length) return '';
      var max = Math.max.apply(null, all), min = Math.min.apply(null, all);
      var W = 600, H = 160, pad = 24;
      function x(i) { return pad + i * (W - 2 * pad) / Math.max(tr.weeks.length - 1, 1); }
      function y(v) { return H - pad - (v - min) * (H - 2 * pad) / Math.max(max - min, 1); }
      function ln(arr) { var pts = []; arr.forEach(function (v, i) { if (v != null) pts.push(x(i) + ',' + y(v)); }); return pts.length > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke-width="2.5"></polyline>' : ''; }
      function dots(arr) { var s = ''; arr.forEach(function (v, i) { if (v != null) s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3"></circle>'; }); return s; }
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trendsvg" role="img" aria-label="每週得分走勢">' +
        '<g class="med">' + ln(med) + dots(med) + '</g>' + (op ? '<g class="opp">' + ln(op) + dots(op) + '</g>' : '') + '<g class="me">' + ln(me) + dots(me) + '</g>' +
        tr.weeks.map(function (w, i) { return '<text x="' + x(i) + '" y="' + (H - 4) + '" class="wl">W' + w + '</text>'; }).join('') + '</svg>';
      return '<div class="row-lbl" style="margin-top:14px">每週得分走勢<span class="label">你 vs ' + esc(opp || '目前對手') + ' vs 聯盟中位數</span></div>' + svg +
        '<p class="note"><span class="lgd me">●</span>你　<span class="lgd opp">●</span>' + esc(opp || '') + '　<span class="lgd med">●</span>聯盟中位數</p>';
    }
    host.innerHTML = '<h2>戰力排名 · 季後賽卡位<span class="label">目前第 ' + (V.curWeek || '?') + ' 週,共 ' + (V.regWeeks || '?') + ' 週例行賽</span></h2>' + rows +
      '<p class="note">虛線以上是戰績排名前 ' + cut + ' 名(晉級名額)。「ESPN預測第 N 名」是 ESPN 官方依戰力算的預測最終名次,不是我自己算的機率;綠色代表目前預測會晉級,紅色代表預測會被擠出去。剩餘約 ' + Math.max((V.regWeeks || 0) - (V.curWeek || 0), 0) + ' 週例行賽還會變動。</p>' + trendChart();
  })();

  // ---------- 6) league-wide future opponents ----------
  (function () {
    var host = document.getElementById('v2future'); if (!host || !D.v2 || !D.v2.future) return;
    var V = D.v2, today = new Date();
    function dateFor(w) { var d = new Date(today.getTime() + (w - (V.curWeek || w)) * 7 * 86400000); return (d.getMonth() + 1) + '/' + d.getDate(); }
    var sosVals = []; Object.keys(V.future).forEach(function (k) { V.future[k].forEach(function (x) { if (x.sos != null) sosVals.push(x.sos); }); });
    sosVals.sort(function (a, b) { return a - b; });
    var avgSos = sosVals.length ? sosVals.reduce(function (a, b) { return a + b; }, 0) / sosVals.length : null;
    function cls(sos) { if (avgSos == null || sos == null) return ''; return sos >= avgSos + 150 ? 'hard' : sos <= avgSos - 150 ? 'soft' : ''; }
    function block(name, list) {
      return '<div class="trendrow" style="grid-template-columns:140px 1fr"><div class="nm">' + esc(name) + '</div><div class="futgrid">' +
        list.map(function (x) { return '<span class="' + cls(x.sos) + '" title="對手平均每週得分約 ' + f1(x.sos) + '">第' + x.w + '週 約' + dateFor(x.w) + '<br>' + esc(x.opp) + '</span>'; }).join('') + '</div></div>';
    }
    var mine = V.future['aespa'];
    var others = Object.keys(V.future).filter(function (k) { return k !== 'aespa'; }).sort();
    host.innerHTML = '<h2>全聯盟未來對手<span class="label">未來 6 週</span></h2>' +
      (mine ? block('aespa(你)', mine) : '') +
      '<details style="margin-top:10px"><summary class="note" style="cursor:pointer">看其他隊的未來對手</summary>' + others.map(function (k) { return block(k, V.future[k]); }).join('') + '</details>' +
      '<p class="note">日期是用「現在時間」往後推算的大略日期,不是 ESPN 原始日期。紅色標籤代表那位對手近期平均得分較高(較硬),綠色代表較軟,方便你判斷現在該衝戰績還是該養傷。</p>';
  })();
} catch (e) {} })();
</script>

<script>
(function () { try {
  // Make "今天要做的事" (and the auto-rewritten block) a real checklist: click to strike through, remembered per browser until the content changes.
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return String(h); }
  var KEY = 'aespa_todo_done';
  var done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { done = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
  function wire(li) {
    if (li.querySelector('.chk')) return;
    var key = hash(li.textContent.trim());
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'chk'; cb.checked = !!done[key];
    if (done[key]) li.classList.add('done');
    cb.addEventListener('change', function () {
      done[key] = cb.checked; save(); li.classList.toggle('done', cb.checked);
      if (cb.checked && li.parentNode) li.parentNode.appendChild(li); // 打勾後折疊並移到清單最下面
    });
    li.insertBefore(cb, li.firstChild);
    // description collapsed by default; click the title to expand/collapse (separate from the checkbox)
    var b = li.querySelector('b');
    if (b) { b.style.cursor = 'pointer'; b.addEventListener('click', function () { li.classList.toggle('open'); }); }
  }
  function sinkDone() {
    Array.prototype.forEach.call(document.querySelectorAll('#todo ol'), function (ol) {
      Array.prototype.slice.call(ol.children).filter(function (li) { return li.classList.contains('done'); }).forEach(function (li) { ol.appendChild(li); });
    });
  }
  function wireAll() { Array.prototype.forEach.call(document.querySelectorAll('#todo ol > li'), wire); sinkDone(); }
  wireAll();
  window.__wireTodoAll = wireAll;
  // the auto-整理 items and stale-marker scripts inject/modify the DOM slightly after this script runs; re-check shortly after load.
  setTimeout(wireAll, 200); setTimeout(wireAll, 800);
} catch (e) {} })();
</script>

<script>
(function () { try {
  // Urgent-event banner: surfaces OUT starters / IR placements right in the header so they are not missed.
  var D = JSON.parse(document.getElementById('data').textContent);
  var I = D.insights || {}; var urgent = [];
  (I.INJ || []).forEach(function (r) { if (r[2] === '先發' && r[1] === 'OUT') urgent.push(r[0] + ' 目前 OUT(先發)'); });
  (I.clearedBench || []).forEach(function (r) { urgent.push(r[0] + ' 已解除傷兵、可出賽但還在板凳'); });
  var lead = document.getElementById('lead'); if (!lead) return;
  var bar = document.createElement('div'); bar.className = 'urgbar' + (urgent.length ? ' on' : '');
  bar.innerHTML = '🔥 ' + urgent.length + ' 件急事:' + urgent.join('、') + '<button type="button">查看</button>';
  lead.parentNode.insertBefore(bar, lead.nextSibling);
  bar.querySelector('button').addEventListener('click', function () { if (window.__showTab) window.__showTab('dec'); var el = document.getElementById('dinj'); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
} catch (e) {} })();
</script>
