}
@media (prefers-color-scheme: dark) {

    --bg: #0f151e; --surface: #17202c; --surface-2: #202b3a; --fg: #e8edf4; --muted: #96a2b4; --line: #2b3748;
    --accent: #7c9bff; --accent-soft: #1f2d5c; --good: #4cc98a; --good-soft: #14352a; --warn: #e5b34d; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3e1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #17202c; --surface-2: #202b3a; --fg: #e8edf4; --muted: #96a2b4; --line: #2b3748;

  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;

.todo ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: n; }
.todo li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.todo li b { display: block; font-size: 15px; }
.todo li b::after { content: " ▸"; font-size: 11px; color: var(--muted); font-weight: 400; }
.todo li.open b::after { content: " ▾"; }
.todo li span.d2 { color: var(--muted); font-size: 13px; display: none; margin-top: 2px; }
.todo li.open span.d2 { display: block; }
.todo li b.lv-out { color: var(--bad); }
.todo li b.lv-dtd { color: var(--warn); }
.todo li b.lv-ok { color: var(--good); }
.muted { color: var(--muted); font-weight: 400; }
.pc { color: var(--muted); font-size: 11px; font-weight: 400; }
.small, table.small { font-size: 12px; }
table.small td, table.small th { padding: 4px 8px; }
.row-lbl.small { margin-top: 6px; color: var(--muted); }
.tm { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; }
.tm .hd { display: flex; flex-wrap: nowrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
details.tm > summary { min-width: 0; }
.tm .hd b { font-size: 16px; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm .hd .chip, .tm .hd .more { flex: 0 0 auto; white-space: nowrap; }
.tm p { margin: 0; font-size: 13.5px; }
.tm .lbl { color: var(--muted); font-size: 12px; margin-right: 6px; }
.tms { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
td .chip { white-space: normal; display: inline-block; border-radius: 6px; line-height: 1.4; }
details.tm > summary { cursor: pointer; list-style: none; display: grid; gap: 6px; }
details.tm > summary::-webkit-details-marker { display: none; }
details.tm > summary .more { color: var(--accent); font-size: 12.5px; font-weight: 700; }
details.tm[open] > summary .more::after { content: ' ▲'; }
details.tm:not([open]) > summary .more::after { content: ' ▼'; }
details.tm .body { display: grid; gap: 8px; margin-top: 8px; }
.tms.one { grid-template-columns: minmax(0, 1fr); }

.board { position: relative; padding-right: 64px; }
.themebtn { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; opacity: 0.85; padding: 0; }
.themebtn:hover { opacity: 1; }
.themebtn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.themebtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script>
(function () {
  var KEY = 'aespa_pw_ok', HASH = '5b3e022e34d6d19915e553c35c2ae4c71c12f15e5d63c19c494f787de5ce787c';
  function sha256(s) { var enc = new TextEncoder().encode(s); return crypto.subtle.digest('SHA-256', enc).then(function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }); }
  function unlock() { document.body.classList.remove('locked'); document.getElementById('pwgate').classList.add('off'); }
  // skip the password gate when not served from the public GitHub Pages site (e.g. this Artifact preview) — Leo doesn't need a password for his own private Artifact
  var isPublicSite = /(^|\.)github\.io$/.test(location.hostname);
  if (!isPublicSite) { unlock(); }
  else { try { if (sessionStorage.getItem(KEY) === HASH) { unlock(); } else { document.body.classList.add('locked'); } } catch (e) { document.body.classList.add('locked'); } }
  var inp = document.getElementById('pwin'), btn = document.getElementById('pwok'), err = document.getElementById('pwerr');
  function tryGo() {
    sha256(inp.value || '').then(function (h) {
      if (h === HASH) { try { sessionStorage.setItem(KEY, HASH); } catch (e) {} unlock(); }
      else { err.textContent = '密碼錯誤'; inp.value = ''; inp.focus(); }
    });
  }
  btn.addEventListener('click', tryGo);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryGo(); });
})();
</script>

分數(兩邊各至少 3 場、差 3 分以上才列出)。","隊友影響會自己對答案:每條預測之後看 5 場實際結果,滿 15 筆後依結果自動校正預估差距。","增補建議與潛力發掘加上隊友影響的說明;潛力發掘另外列出「隊友缺陣時明顯多拿分」的自由球員。","「陣容與增補」分頁新增「預測檢驗」:記錄每週勝率預測與每日先發預估,和實際結果比較。","修正 iPhone 顯示:加上手機寬度設定,不會再被縮成電腦版。","球員最近 10 場改成真正的最近 10 場比賽(原本是最近 10 天),逐場資料改成只抓一次。","最上方新增搜尋框:輸入名字就能打開任何球員的頁面(持有率前 450 名與所有陣容球員)。","「今天要做的事」新增上場時間警示:你的球員近 3 場上場時間比之前多或少 5 分鐘以上時提醒。","「陣容與增補」新增「季後賽賽程」:你每位球員在季後賽 3 輪各有幾場比賽,和聯盟平均比較。","交易分析器新增「交易對象建議」:找雙方都補到弱點、價值相近的一換一,一鍵放進分析器。","每個區塊點標題就能收合;決策頁的上週戰報、對手 Streaming 防範、背靠背、球員比較預設收起。","手寫待辦一律標上撰寫時間,並註明數字以自動產生的「本週局勢」為準,避免和自動預估對不上。"]},{"v":"v2.30","date":"11/12","items":["增補建議、異動說明、潛力發掘、陣容檢查改成每次更新自動產生,不用再手寫。","Streaming 試算與自動增補建議遵守 C 資格最多 4 人的規則,不會再建議放後衛加中鋒而超過上限。","手寫只剩「今天要做的事」與 Threads,改用 apply-hand.mjs 套用,每日更新更省 token。"]},{"v":"v2.29","date":"11/12","items":["修正網站同一頁混著新舊資料:頁首改成同時顯示「數字更新」與「判斷撰寫」兩個時間(原本只顯示 11/9 的手寫時間)。","陣容評語、傷兵快報、賽程場次、陣容裡的傷病說明、Streaming 說明,改成每次更新都依 ESPN 最新資料重新產生,不再出現新數字配舊文字。","手寫的判斷區塊(待辦、增補建議、Threads、昨日賽後、潛力發掘、陣容說明)過了撰寫當天會標示「X/X 寫的判斷」。","新增 brief.json:每次更新順便產生一份約 4 KB 的精簡簡報,給 Claude 讀,不用再讀整份網站或 data.json。"]},{"v":"v2.28","date":"11/9","items":["修正「決策」頁上方兩個空白框(上週戰報 / 應對策略+勝率預測):本週(11/9 開始的第4輪)的對手跟上週剛好都是 Chicago Firebugs,原本程式用「對手名字有沒有變」來判斷換週,名字沒變就誤判成沒換週,導致上週戰報永遠存不進去;改成用賽程的計分期編號判斷換週,不受對手名字重複影響。","附帶修正「戰況」頁每週對戰表的日期:原本的 11/2~11/8 是舊資料,從沒被自動刷新過,之後每週會跟著真正的賽程期自動算出正確日期。","這兩個修正都在 update.mjs(資料更新腳本),下一次 ESPN 把目前對陣期正式切到第4輪後,自動更新就會補上這週的「上週戰報」;在那之前畫面會持續空白一小段時間,是正常的,等 ESPN 那邊切換過來就會自動填上,不用手動處理。"]},{"v":"v2.27","date":"11/9","items":["Threads 追蹤清單新增 @emilyca95112(灣區小市民,專注傷兵輪替分析,每日傷兵名單另發在 IG);依 Leo 在對話裡傳的帳號加入,其餘追蹤帳號與關鍵字搜尋內容不變,交給每天 18:00 的 Threads 排程任務之後接手更新"]},{"v":"v2.26","date":"11/9","items":["修正手機版陣容表格的版面問題:「陣容與增補」主表與「聯盟成員」展開後的各隊陣容表,手機版原本是 9~10 欄的表格硬塞進窄螢幕,只看得到最左邊 2~3 欄(位置、球員名的一部分),今年/近7場/分鐘/去年/持有%/本週/下週/判斷都被裁切在畫面外,也沒有明顯的左右滑動提示","改成手機版(寬度 ≤640px)專用的卡片式版面:每位球員變成一張卡片,位置與球員名放最上面、判斷評語放最下面,中間的今年、近7場、分鐘、去年、持有%、本週、下週都各自標上欄位名稱,不用再對照表頭","桌面版(>640px)完全不受影響,原本的表格版面、欄位排序(點表頭排序)都維持原樣,只有手機版的 CSS 與資料標籤改變,沒有動到任何球員資料或判斷邏輯"]},{"v":"v2.25","date":"11/9","items":["修正 v2.24 的錯誤:上一版誤判你本週把 Isaiah Hartenstein 換成了 Alex Sarr,重新核對 ESPN 即時陣容與交易記錄後確認你目前陣容與上週相同(Hartenstein 仍在隊上,Sarr 不在),roster、league.you、picks、pickNote、acqNote、todo、foot 相關文字已全部更正","新發現:你有一筆 Devin Vassell 換 Klay Thompson 的 waiver 申請目前是 PENDING(等待清出自動執行),已加入 todo 與 acqNote 提醒,不需要再手動操作","C 資格上限 4 人的提醒改回正確名單(Mobley、Kessler、Okongwu、Hartenstein)"]},{"v":"v2.24","date":"11/9","items":["新的一週(matchup 4,11/9 起)用 Claude in Chrome 重新連上 ESPN 全面核對:發現你本週已經自己把 Isaiah Hartenstein 換成 Alex Sarr(用了 2/7 次異動額度,不是額滿週),陣容評語、chip 已更新,Hartenstein 從你的 roster 移除","重寫陣容評語(roster)、聯盟十隊的核心球員/判斷/對你(league.teams、league.you),修正了 Podcast P 的 Sengun 數字與總得分舊的錄誤(52/52/44 → 實際 48/48/44;pf 3007 → 實際 3516)","增補建議改成 Josh Hart(自由市場可直接加入)為首選,原本推薦的 Devin Vassell 查出目前在 waiver、要等 11/15 才清出;acqNote 更正本週異動額度為 2/7(先前誤記成已滿)","Streaming、潛力發掘(sleepers)、賽程統計(sched)、賽後摘要(recap,11/8 美東五場比賽用 TPBL 計分重算並核對 ESPN 顯示的分數)、傷兵清單全部重新讀取 ESPN 更新,新增 Jamal Murray 今天的 DTD 傷況","C 資格上限 4 人、本週異動額度未滿兩點新增進 todo,供之後換人判斷參考;matchup 與 matchupDays 因 ESPN 的 currentMatchupPeriod 還沒切到新的一週,這次沒有手動改動,留給下一次自動更新接手"]},{"v":"v2.23","date":"11/9","items":["早間出賽確認(鎖陣前):scoring period 20(11/8 美東,週日)先發 10 人全為 ACTIVE 或 DTD(Quickley),今天有比賽的 DET(Cunningham)、PHI(Maxey)、LAL(Kessler)、LAC(Garland)、MIA(Thompson)都已在先發;沒有比賽的 DEN(Murray)、CLE(Mobley)、GS(Lendeborg)、MEM(Boozer)、TOR(Quickley)不受影響;替補(Wagner、Okongwu、Hartenstein)與 IR 的 Morant(左大腿後肌,預計 12/1 回歸)、Kawhi Leonard(左膝,預計 11/23 回歸)皆仍 OUT 且今天都沒有比賽,陣容不需調整","傷兵清單核對更新:Kon Knueppel 11/8 確診新的左大腿後肌拉傷,回歸日由 11/9 更新為 12/12(ESPN 預計 4 週後重新評估);Kristaps Porzingis 的 ESPN 預設回歸日由 12/1 順延到 1/2(仍不確定是否復出);Trey Murphy III、Nic Claxton、Keegan Murray 已不在 ESPN 傷兵名單上(皆已恢復出賽),從清單移除"]},{"v":"v2.22","date":"11/8","items":["修正待辦裡「湖人→塞爾提克→獨行俠」洗場次鏈的建議:對照 ESPN League Settings 確認這個聯盟 C 資格球員上限是 4 人,而你陣容的 Mobley、Kessler、Okongwu、Hartenstein 剛好卡滿 4 個 C——原建議要加入的 Mitchell Robinson 是 C,會超過上限,必須先丟掉現有 4 個 C 其中一個才能加入,之前的待辦沒有提到這點,現已補上提醒與替代方案"]},{"v":"v2.21","date":"11/8","items":["用 Claude in Chrome 連上 ESPN 重新檢查:今天(scoring period 20,週日)先發 10 人全為 ACTIVE 或已在場上(Quickley 仍 DTD,放在 UTIL,TOR 若無賽事不影響),IR 的 Morant、Kawhi 仍 OUT,陣容不用調整","發現原本待辦推薦的增補對象 Trey Murphy III 已被對手 Podcast P 搶先加入,不再可選;重新查自由市場,改推 Devin Vassell(SA,SG/SF)取代,picks/pickNote/acqNote 與 todo 已同步更新","確認本週異動額度確實已滿(ESPN 頁面顯示 Matchup Acquisition Limit 6/6),換人建議維持改到 11/9 新的一週","核對「湖人→塞爾提克→獨行俠」洗場次鏈的三名球員(Grimes、Mitchell Robinson、Risacher)目前仍在自由市場,待辦已更新最新數字","傷兵清單逐條核對(Quickley、Hart、Suggs、Morant、Kawhi、Porzingis、Keegan Murray 等)與 ESPN 現況一致,未變動;賽後摘要、聯盟成員判斷、陣容評語、Streaming、潛力發掘本次沿用舊內容未重讀"]},{"v":"v2.20","date":"11/8","items":["早間出賽確認:本次未能完成。雲端環境無法連線 ESPN(fantasy.espn.com、lm-api-reads、site.api.espn.com 皆被代理伺服器拒絕),也沒有 Claude in Chrome 可用,因此沒有檢查陣容與傷病,todo 與 injuries 維持原內容,請自行確認 Quickley(DTD)等球員狀態"]},{"v":"v2.19","date":"11/8","items":["重做「每日爆走／爆胎榜」每一列的排版:原本用 grid + baseline 對齊把名字、長條圖、數字、說明文字擠在同一格,手機版會讓長條跟數字浮動歪斜、說明文字被切斷;改成每列固定三行(名字+漲跌數字 → 長條圖佔滿寬度 → 說明文字),手機版與桌面版都重新截圖確認排版整齊"]},{"v":"v2.18","date":"11/8","items":["修正手機版「陣容與增補」分頁的球員表格:長段文字的「判斷」欄被捲出畫面時會撐高整列,導致前兩欄(位置/球員)看起來留白很多;改成文字靠上對齊,改善空白問題(要完全消除需要重做手機版卡片排版,先不動)","修正「聯盟成員」分頁隊名過長時(例如「17*3PTS's Pointed Team」)會把旁邊「展開陣容▼」擠到被截斷的問題,改成隊名自動用省略號截斷,展開連結保持完整顯示","清理 8 條確認沒有用到的 CSS 規則與對應的孤兒 media-query 覆寫(純內部整理,畫面無任何變化)"]},{"v":"v2.17","date":"11/8","items":["待辦重寫:移除已過期的「週日對手追分」「週六日陣容確認」等舊項目,保留 11/9 換人建議與 Quickley DTD 提醒;逐日重讀 ESPN 11/7、11/8 陣容(Quickley DTD,Morant、Leonard 仍 OUT)","asof 更新;賽後摘要、球員評語、聯盟成員判斷、潛力發掘、傷兵清單本次沿用舊內容(未重讀)"]},{"v":"v2.16","date":"11/8","items":["右上角新增「⚡ 立即更新」按鈕:按下去直接對 ESPN 現場查詢(不經過排程、不等 GitHub Actions),立刻刷新「今天的比賽」即時比分,並重新抓本週剩餘日子雙方的即時陣容來更新「本週對戰」表格的場次數字,解決對手臨時交易/換人時畫面沒跟上的問題;預估得分、爆走爆胎榜等需要疊加歷史數據的區塊仍沿用排程結果"]},{"v":"v2.15","date":"11/8","items":["每日爆走／爆胎榜:改成只顯示前 5 名,第 6–10 名收進可展開區塊;每筆加上橫向長條圖(跟當天最大落差的相對比例),一眼看出差距大小","新增「上週戰報」(決策分頁最上面):每次新的一週開始,把上一週的終局比分、爆走/爆胎常客(整週出現 2 次以上的人)都存下來,方便規劃這週的策略;修正爆走/爆胎週累計之前會因為同一天跑好幾次更新被重複計數的問題,現在改成每個行事曆日只算一次"]},{"v":"v2.14","date":"11/8","items":["新增「戰況」分頁的「每日爆走／爆胎榜」:每天賽後,把所有球員(聯盟陣容+前段自由球員)的實際得分跟自己的預期基準(今年平均,樣本不足改用去年或近 15 場)比,抓出落差最大的 10 個爆走跟 10 個爆胎,只看預期值至少 10 分的人避免雜訊干擾;同時累計本週出現 2 次以上的球員,自動寫一句短評(例如連續爆走代表上場時間在增加,連續爆胎可能狀態或角色有變化) <script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var f1 = function (v) { return v == null ? '—' : Number(v).toFixed(1); };

  // Two clocks: numbers refresh on every pipeline run (autoAsof); judgment text is written by hand (asof).
  $('asof').textContent = '數字更新 ' + (D.autoAsof || D.asof) + ' · 判斷撰寫 ' + D.asof;
  // A hand-written section older than today (Taipei) gets a notice, so fresh numbers never sit next to
  // stale advice without saying so. Dates come from D.handAsof, set whenever that section is rewritten.
  var tpeToday = (function () { try { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }); } catch (e) { return ''; } })();
  var stale = function (k) {
    var d = (D.handAsof || {})[k];
    if (!d || !tpeToday || d >= tpeToday) return '';
    var p = d.split('-');
    return '<p class="note" style="color:#c2410c">⚠ 這區是 ' + (+p[1]) + '/' + (+p[2]) + ' 寫的判斷,上面的數字是最新的,但內容還沒重新評估。</p>';
  };
  $('leagueline').textContent = 'TPBL · 10 隊 H2H 積分 · 戰績 ' + D.record;

  var m = D.matchup, diff = m.meScore - m.oppScore;
  $('score').innerHTML =
    '<div class="team"><div class="pts num">' + m.meScore + '</div><div class="nm">' + esc(m.me) + '</div></div>' +
    '<div class="vs">VS</div>' +
    '<div class="team"><div class="pts num">' + m.oppScore + '</div><div class="nm">' + esc(m.opp) + '</div></div>';
  $('lead').innerHTML = '<span>領先 <b>' + (diff >= 0 ? '+' : '') + diff + '</b> 分</span><span>剩餘 ' + esc(m.daysLeft) + '</span><span>' + esc(m.oppNote) + '</span>';

  var r = D.recap;
  $('recap').innerHTML =
    '<h2>昨日賽後<span class="label">' + esc(r.date) + '</span></h2>' + stale('recap') +
    '<div class="games">' + r.games.map(function (g) { return '<div class="game">' + esc(g[0]) + '<small>' + esc(g[1]) + '</small></div>'; }).join('') + '</div>' +
    '<div class="row-lbl">你的球員(合計 ' + r.mineTotal + ' 分)</div>' +
    '<div class="scroll"><table><thead><tr><th>球員</th><th>數據</th><th class="n">得分</th></tr></thead><tbody>' +
    r.mine.map(function (p) { return '<tr><td class="name">' + esc(p[0]) + '<small>' + esc(p[1]) + '</small></td><td>' + esc(p[2]) + '</td><td class="n fp">' + p[3] + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
    '<div class="row-lbl">全場最高(TPBL 計分)</div>' +
    '<div class="scroll"><table><tbody>' +
    r.others.map(function (p) { return '<tr><td class="name">' + esc(p[0]) + '<small>' + esc(p[1]) + '</small></td><td>' + esc(p[2]) + (p[4] ? '<br><span class="note">' + esc(p[4]) + '</span>' : '') + '</td><td class="n fp">' + p[3] + '</td></tr>'; }).join('') +
    '</tbody></table></div>';

  // Daily burst/bust leaderboard: who scored far above/below their own expected baseline
  // (season avg, or last-year/15-game as fallback) in the day's completed games, computed
  // server-side in build.mjs from the existing per-player game logs. Plus a short auto

  (function () {
    var Bu = D.burst, el = $('burst'); if (!el) return;

    var maxDiff = Math.max(1, Math.max.apply(null, (Bu.up || []).concat(Bu.down || []).map(function (r) { return Math.abs(r.diff); })));

      var pct = Math.min(100, Math.max(5, Math.round(Math.abs(r.diff) / maxDiff * 100)));

    }
    function section(title, icon, list, cls, emptyMsg) {
      if (!list.length) return '<p class="note">' + emptyMsg + '</p>';
      var head = list.slice(0, 5), rest = list.slice(5);
      var html = '<div class="row-lbl">' + icon + ' ' + title + ' Top ' + list.length + '</div><ul class="blist">' + head.map(function (r) { return row(r, cls); }).join('') + '</ul>';

  function sg0(a) { return (a || []).reduce(function (t, r) { return t + (r ? r[0] : 0); }, 0); }

<script type="module">
// 即時數據:網頁打開、從背景切回來、開著時每 2 分鐘,都在瀏覽器裡跑一次和 GitHub Actions 同一份的
// live.mjs(戰績、本週對戰、陣容與評語、賽程、傷兵),直接向 ESPN 讀;ESPN 這個 read API 對公開聯盟
// 不需要登入、可以跨網域讀。增補建議、潛力發掘、streaming 等重計算仍由 Actions 產生。
// 套用:剛打開或剛切回來、還沒操作過 → 直接重新載入套用(分頁與捲動位置會保留);
// 正在看的時候 → 只就地更新頂部比分,並顯示「有新數據」按鈕,按了才重新載入,不會打斷閱讀。
import { refresh } from './live.mjs';
const KEYS = ['asof', 'league', 'record', 'matchup', 'recap', 'injuries', 'threads', 'roster', 'sched', 'foot', 'stream', 'todo', 'version', 'changelog', 'handAsof']; // 同 build.mjs 的 OVER(autoAsof 另外記)
const LG = 'https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/2027/segments/0/leagues/406470928';
const SNAP = JSON.parse(document.getElementById('data').textContent); // 目前畫面用的資料(可能已套上即時快取)
const $ = id => document.getElementById(id);
const btn = $('livebtn'), ts = $('livets'), wrap = $('livewrap');
const hm = t => new Date(t).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hourCycle: 'h23', hour: '2-digit', minute: '2-digit' });
const pick = A => { const o = {}; KEYS.forEach(k => { if (A[k] !== undefined) o[k] = A[k]; }); o.matchupDays = A.matchupDays; return o; };
const shownSig = JSON.stringify(pick(SNAP));
let busy = false, touched = false, ids = null, newBtn = null;
['pointerdown', 'touchstart', 'keydown'].forEach(e => addEventListener(e, () => { touched = true; }, { passive: true, capture: true }));

const setTs = (at, extra) => { ts.textContent = '即時數據 ' + hm(at) + (extra ? ' · ' + extra : ''); };
const freshPage = () => location.replace(location.pathname + '?v=' + Date.now()); // 帶參數避開瀏覽器快取的舊網頁
function offer(go) {
  if (newBtn) return;
  newBtn = document.createElement('button'); newBtn.type = 'button'; newBtn.className = 'livebtn livenew';
  newBtn.textContent = '有新數據 · 點這裡套用'; newBtn.onclick = go;
  wrap.insertBefore(newBtn, ts);
}

  const p = document.querySelectorAll('#score .pts');
  if (p.length === 2) { p[0].textContent = m.meScore; p[1].textContent = m.oppScore; }
  const b = document.querySelector('#lead b'); if (b) { const d = m.meScore - m.oppScore; b.textContent = (d >= 0 ? '+' : '') + d; }

// mode: 'open' 打開或切回來、'tick' 定時或陣容有變、'force' 按「立即更新」
async function run(mode) {
  if (busy) return; busy = true;
  if (mode === 'force') { btn.disabled = true; btn.textContent = '更新中…'; }
  try {
    const D = await fetch('../data.json?nc=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('data.json HTTP ' + r.status); return r.json(); });
    ids = await refresh(D, { fetchInit: { cache: 'no-store' } });

    const over = pick(SNAP); KEYS.forEach(k => { if (D[k] !== undefined) over[k] = D[k]; });

async function checkBuild() {
  if (!/github\.io$/.test(location.hostname)) return false;
  try {
    const h = await fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' }).then(r => (r.ok ? r.text() : ''));
    const m = h.match(new RegExp('"built' + 'At":"([^"]+)"'));

async function watch() {
  if (busy || document.hidden || !ids) return;
  try {
    const g = u => fetch(u, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const [a, b, tx] = await Promise.all([
      g(LG + '?view=mRoster&scoringPeriodId=' + ids.today + '&forTeamId=' + ids.meId),
      g(LG + '?view=mRoster&scoringPeriodId=' + ids.today + '&forTeamId=' + ids.oppId),
      g(LG + '?view=mTransactions2&scoringPeriodId=' + ids.today)]);
    const sig = [a, b].map(j => (j.teams || []).filter(t => t.roster).map(t => t.id + ':' + t.roster.entries.map(e =>
      e.playerId + '/' + e.lineupSlotId + '/' + ((e.playerPoolEntry && e.playerPoolEntry.player.injuryStatus) || '')).sort().join(',')).join('|')).join('#') +
      '#' + (tx.transactions || []).filter(t => t.status === 'EXECUTED').map(t => t.id).sort().join(',');
    const key = ids.meId + '-' + ids.oppId + '-' + ids.today; // 換日或換對手時只重記基準
    if (key !== watchKey) { watchKey = key; watchSig = sig; return; }
    if (sig !== watchSig) { watchSig = sig; run('tick'); }
  } catch (e) { /* 讀不到就等下一次 */ }
}

if (SNAP.liveAt) { setTs(SNAP.liveAt); try { ids = JSON.parse(localStorage.getItem('aespaLive')).ids || null; } catch (e) {} }
btn.onclick = () => run('force');
onOpen();
document.addEventListener('visibilitychange', () => { if (!document.hidden) onOpen(); });
setInterval(() => { if (!document.hidden) run('tick'); }, 120000);
setInterval(watch, 20000);
</script>

  var D = JSON.parse(document.getElementById('data').textContent), host = document.getElementById('todo'); if (!host || !D.insights || !D.cmp) return;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  var own = {}; D.cmp.forEach(function (l) { var a = l.split('|'); own[a[1]] = a[4]; });
  var free = function (n) { var o = own[n]; return o == null || o === '' || o === 'FA' || o === 'Waiver'; };
  var I = D.insights, W = (D.streamPlan || {}).windows || [], items = [];
  // 1) lineup days that need changes
  var need = (I.LU || []).filter(function (d) { return d.n > 10 && d.best - d.cur > 0.05; });
  if (need.length) items.push(['先做', '先發要調整:' + need.map(function (d) { return d.d; }).join('、'), need.map(function (d) { return d.d + ' 換上 ' + (d.ins.join('、') || '—') + '(最佳 ' + f1(d.best) + ',現在 ' + f1(d.cur) + ')'; }).join(';') + '。']);
  else if ((I.LU || []).length) items.push(['留意', '本週先發不用調整', (I.LU || []).map(function (d) { return d.d + ' ' + d.n + ' 人有比賽'; }).join('、') + ',放得下所有人。']);
  // 2) injured starters
  var inj = (I.INJ || []).filter(function (r) { return r[2] === '先發'; });
  if (inj.length) items.push(['先做', '先發有傷兵要確認', inj.map(function (r) { return r[0] + '(' + r[1] + ',本週 ' + r[4] + ' 場)'; }).join('、') + '。上場前再看一次 ESPN 狀態,OUT 的先換下來。']);
  // 3) best add (next week first, because the weekly add limit is usually used up by then)
  var pick = null, label = '';
  for (var k = W.length - 1; k >= 0 && !pick; k--) { var rows = (W[k].rows || []).filter(function (r) { return free(r[0]); }); if (rows.length) { pick = rows; label = W[k].label; } }
  if (pick) { var r = pick[0], r2 = pick[1];
    items.push(['建議', '增補首選:放 ' + r[6] + ' 加 ' + r[0], label.replace(/(.*?)(\(.*)/, '$1') + ':' + r[0] + '(' + r[1] + ',' + r[2] + ',持有 ' + f1(r[3]) + '%)預估場均 ' + f1(r[4]) + '、' + r[5] + ' 場,換掉 ' + r[6] + '(' + f1(r[7]) + '、' + r[8] + ' 場),預估增加 ' + f1(r[9]) + ' 分。' + (r2 ? '備選:' + r2[0] + '(+' + f1(r2[9]) + ')。' : '') + (r[2] === 'Waiver' ? ' 他在 waiver,週日 08:00(美東)處理。' : '') + ' 本週額度已滿時留到下週一。']); }
  // 4) matchup
  var M = D.matchup || {}, P = (D.matchupDays || {}).proj || {};
  if (M.meScore != null && P.days && P.days.length) { var sm = function (a) { return a.reduce(function (t, x) { return t + (x ? x[1] : 0); }, 0); }, wk = M.meScore - M.oppScore, fin = wk + sm(P.me) - sm(P.op);
    items.push(['留意', '本週局勢:' + (wk >= 0 ? '領先 ' : '落後 ') + Math.abs(wk) + ' 分', '你 ' + M.meScore + '、' + M.opp + ' ' + M.oppScore + ';剩 ' + P.days.join('、') + ',預估最終' + (fin >= 0 ? '領先 ' : '落後 ') + f1(Math.abs(fin)) + ' 分(粗估)。']); }
  // 5) players whose team plays today AND tomorrow (today is game 1 of a back-to-back)
  if (D.sch) {
    var today5 = new Date(), tmr5 = new Date(today5.getTime() + 86400000);
    var md5 = function (d) { return (d.getMonth() + 1) + '/' + d.getDate(); };
    var tStr5 = md5(today5), tmStr5 = md5(tmr5);
    var teamsMine5 = {};
    D.cmp.forEach(function (l) { var a = l.split('|'); if (a[4] === 'aespa') { (teamsMine5[a[2]] = teamsMine5[a[2]] || []).push(a[1]); } });
    var hitNames5 = [];
    Object.keys(teamsMine5).forEach(function (t) {
      var s5 = ((D.sch[t] || [])[1] || '').split(';');
      var has5 = function (mdStr) { return s5.some(function (e) { return e.indexOf(mdStr + ':') === 0; }); };
      if (has5(tStr5) && has5(tmStr5)) hitNames5 = hitNames5.concat(teamsMine5[t]);
    });
    if (hitNames5.length) items.push(['留意', '明天背靠背第二場:' + hitNames5.join('、'), hitNames5.join('、') + ' 今天(' + tStr5 + ')有比賽,明天(' + tmStr5 + ')連著再打一場(背靠背),純粹提醒留意,用這聯盟自己的資料回測過,背靠背第二場不一定比較低分,先發排程自行判斷就好。']);
  }
  // role change: your players whose minutes over the last 3 games moved 5+ from the rest of the season
  (function () { var R = D.roleAlerts || []; if (!R.length) return;
    var dn = R.filter(function (r) { return r[2] < r[3]; }), up = R.filter(function (r) { return r[2] > r[3]; });
    var line = function (r) { return r[0] + ' 近 3 場 ' + Math.round(r[2]) + ' 分鐘(之前 ' + Math.round(r[3]) + ')、fantasy ' + Math.round(r[4]) + ' 分(之前 ' + Math.round(r[5]) + ')'; };
    if (dn.length) items.push(['留意', '上場時間變少:' + dn.map(function (r) { return r[0]; }).join('、'), dn.map(line).join(';') + '。可能是角色改變、輪換縮短或小傷,先看新聞再決定要不要換人。']);
    if (up.length) items.push(['留意', '上場時間變多:' + up.map(function (r) { return r[0]; }).join('、'), up.map(line).join(';') + '。角色可能在變重,先發優先考慮。']);
  })();
  // merge into the SAME list as the hand-written todo (no separate "自動整理" box) so there's one list, not two.
  var ol = document.getElementById('todoOl'); if (!ol) return;
  var cls = { '先做': 'lv-out', '建議': 'lv-ok', '留意': 'lv-dtd' };
  var rank = { '先做': 0, '建議': 1, '留意': 2 };
  var frag = items.map(function (x) { return '<li data-auto="1" data-lv="' + esc(x[0]) + '"><span><b class="' + cls[x[0]] + '">' + esc(x[1]) + '</b><span class="d2">' + esc(x[2]) + '</span></span></li>'; }).join('');
  ol.insertAdjacentHTML('afterbegin', frag);
  // re-sort the merged list by priority (先做 > 建議 > 留意), keeping relative order within each tier
  Array.prototype.slice.call(ol.children).map(function (li, i) { return { li: li, i: i, r: rank[li.getAttribute('data-lv')] != null ? rank[li.getAttribute('data-lv')] : 1 }; })
    .sort(function (a, b) { return a.r - b.r || a.i - b.i; }).forEach(function (x) { ol.appendChild(x.li); });
  if (window.__wireTodoAll) window.__wireTodoAll();
} catch (e) {} })();
</script>

<script>

  var cand = {}; (D.picks || []).forEach(function (p) { cand[p.name] = 1; }); ((D.stream || {}).rows || []).forEach(function (r) { cand[r[0]] = 1; }); ((D.sleepers || {}).rows || []).forEach(function (r) { cand[r[0]] = 1; });

<script>
(function () { try {
  var D = JSON.parse(document.getElementById('data').textContent);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function f1(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1); }
  var LG = D.logs || {};
  var P = (D.cmp || []).map(function (l) { var a = l.split('|'); var n = function (i) { return a[i] === '' || a[i] == null ? null : +a[i]; };
    return { id: a[0], name: a[1], team: a[2], pos: a[3], own: a[4], inj: a[5], s27: n(6), l7: n(7), l15: n(8), s26: n(9), pct: n(12), chg: n(13), rest: n(14), next: n(15) }; });
  function est(p) { var v = [p.s27, p.l15].filter(function (x) { return x != null && !(p.s27 === 0 && p.l15 === 0); }); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; }
  function ownLabel(p) { return p.own === 'FA' ? '自由球員' : p.own === 'Waiver' ? 'Waiver' : p.own; }
  function plabel(p) { return p.name + '（' + ownLabel(p) + '）'; }
  var byLabel = {}; P.forEach(function (p) { byLabel[plabel(p)] = p; });

  // ---------- 1) rolling trend sparklines (your current roster) ----------
  (function () {
    var host = document.getElementById('v2trend'); if (!host) return;
    var mine = P.filter(function (p) { return p.own === 'aespa'; }).sort(function (a, b) { return (est(b) || 0) - (est(a) || 0); });
    var rows = mine.map(function (p) {
      var lg = LG[p.id]; if (!lg || !lg[8] || !lg[8].length) return null;
      var games = lg[8].slice().reverse(); // chronological
      var scores = games.map(function (g) { return g[2]; });
      var mx = Math.max.apply(null, scores.concat([1])), mn = Math.min.apply(null, scores.concat([0]));
      var rng = Math.max(mx - mn, 1);
      var bars = scores.map(function (s) { var h = Math.max(4, Math.round((s - mn) / rng * 26) + 2); var cls = p.s27 != null ? (s >= p.s27 ? 'up' : 'down') : ''; return '<i class="' + cls + '" style="height:' + h + 'px" title="' + f1(s) + '"></i>'; }).join('');
      var last = scores[scores.length - 1], diff = p.s27 != null ? last - p.s27 : null;
      return '<div class="trendrow"><div class="nm">' + esc(p.name) + '<small>' + esc(p.team) + ' · ' + esc(p.pos) + (p.inj ? ' · ' + esc(p.inj) : '') + '</small></div><div class="spark">' + bars + '</div><div class="diff ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '') + '">最近 ' + f1(last) + (diff == null ? '' : '(' + (diff >= 0 ? '+' : '') + f1(diff) + ')') + '</div></div>';
    }).filter(Boolean);
    host.innerHTML = '<h2>滾動趨勢<span class="label">你的陣容,近 10 場</span></h2>' + (rows.length ? rows.join('') : '<p class="note">暫無資料。</p>') + '<p class="note">長條是每場 fantasy 分數,由舊到新;綠色代表當場高於今年平均,紅色代表低於。右側是最近一場與今年平均的差。</p>';
  })();

  // ---------- 1b) prediction check ----------
  (function () {
    var host = document.getElementById('v2pred'); if (!host) return;
    var PC = D.predCheck || {}, W = PC.win || {}, Dy = PC.day || {}, MC = D.matesCal || {};
    var h = '<h2>預測檢驗<span class="label">網站的預測準不準</span></h2>';
    h += '<div class="row-lbl">每週勝率預測(週一開打前最後一次)</div>';
    if (!W.n) h += '<p class="note">已開始記錄,下一週打完後會出現第一筆結果。</p>';
    else h += '<p class="note">' + W.n + ' 週裡猜對勝負 ' + W.hit + '%;Brier 分數 ' + W.brier + '(0 最好,0.25 等於每週都猜 50%)。</p>' +
      '<div class="scroll"><table><thead><tr><th>週</th><th>對手</th><th class="n">預測勝率</th><th class="n">預估</th><th class="n">實際</th><th>結果</th></tr></thead><tbody>' +
      W.rows.map(function (r) { return '<tr><td>第 ' + r[0] + ' 週</td><td>' + esc(r[1]) + '</td><td class="n">' + r[2] + '%</td><td class="n">' + Math.round(r[3]) + '–' + Math.round(r[4]) + '</td><td class="n">' + Math.round(r[5]) + '–' + Math.round(r[6]) + '</td><td class="' + (r[7] ? 'up' : 'down') + '">' + (r[7] ? '勝' : '敗') + ((r[2] >= 50) === !!r[7] ? '(猜對)' : '(猜錯)') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '<div class="row-lbl">每日先發預估</div>';
    if (!Dy.n) h += '<p class="note">已開始記錄,今天的比賽打完後會出現第一筆。</p>';
    else h += '<p class="note">' + Dy.n + ' 天,每隊每天平均誤差 ' + f1(Dy.mae) + ' 分;實際總分是預估的 ' + Math.round(Dy.ratio * 100) + '%' + (Dy.ratio > 1.05 ? ',預估偏保守' : Dy.ratio < 0.95 ? ',預估偏樂觀' : ',大致準') + '。</p>' +
      '<div class="scroll"><table><thead><tr><th>日期</th><th class="n">你 預估/實際</th><th class="n">對手 預估/實際</th></tr></thead><tbody>' +
      Dy.rows.slice().reverse().map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="n">' + Math.round(r[1]) + ' / ' + Math.round(r[2]) + '</td><td class="n">' + Math.round(r[3]) + ' / ' + Math.round(r[4]) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '<div class="row-lbl">隊友影響</div>';
    var A0 = MC.all || { n: 0 }, min = MC.min || 15;
    h += '<p class="note">' + (A0.n ? '已對答案 ' + A0.n + ' 筆:方向猜對 ' + A0.hit + '%,平均誤差 ' + f1(A0.mae) + ' 分' + (A0.n >= min ? ',校正後誤差 ' + f1(A0.maeK) + ' 分' : '') + '。' : '還沒有結果。') + '還在等結果 ' + (MC.open || 0) + ' 筆;滿 ' + min + ' 筆後,復出、受傷各自開始自動校正。</p>';
    h += '<p class="note">程式只會自動調整隊友影響的校正倍數;勝率和每日預估目前只記錄,不會自己改。規則要不要調整,看這裡的數字再決定。</p>';
    host.innerHTML = h;
  })();

  // ---------- 1c) playoff schedule ----------
  (function () {
    var host = document.getElementById('v2po'), PS = D.playoffSched; if (!host || !PS) return;
    var R = PS.rounds, nR = R.length, avgT = PS.avg.reduce(function (a, b) { return a + b; }, 0);

    var tot = Object.keys(PS.teams).map(function (t) { return [t, PS.teams[t].reduce(function (a, b) { return a + b; }, 0)]; }).sort(function (a, b) { return b[1] - a[1]; });
    var mx = tot[0][1], mn = tot[tot.length - 1][1];
    var best = tot.filter(function (x) { return x[1] === mx; }).map(function (x) { return x[0]; }), worst = tot.filter(function (x) { return x[1] === mn; }).map(function (x) { return x[0]; });
    host.innerHTML = '<h2>季後賽賽程<span class="label">' + R.map(function (r) { return r[0] + ' ' + r[1] + '–' + r[2]; }).join(' · ') + '</span></h2>' +
      '<div class="scroll"><table><thead><tr><th>你的球員</th>' + R.map(function (r) { return '<th class="n">' + r[0].replace('第 ', 'R').replace(' 輪', '') + '</th>'; }).join('') + '<th class="n">合計</th><th class="n">預估</th></tr></thead><tbody>' +
      PS.mine.map(function (p) { return '<tr><td class="name">' + esc(p[0]) + '<small>' + esc(p[1]) + (p[nR + 4] ? ' · ' + esc(p[nR + 4]) : '') + '</small></td>' + R.map(function (r, i) { return cell(p[2 + i], PS.avg[i]); }).join('') + cell(p[2 + nR], avgT) + '<td class="n">' + f1(p[3 + nR]) + '</td></tr>'; }).join('') +
      '<tr class="tot"><td>全聯盟平均</td>' + PS.avg.map(function (a) { return '<td class="n">' + f1(a) + '</td>'; }).join('') + '<td class="n">' + f1(avgT) + '</td><td></td></tr></tbody></table></div>' +
      '<p class="note">數字是那一輪該球員的球隊有幾場 NBA 比賽,綠色比平均多、紅色比平均少。' + (R.some(function (r) { return r[3] > 1; }) ? '最後一輪連打兩週,場數比較多。' : '') + '季後賽場次最多:' + best.join('、') + '(' + mx + ' 場);最少:' + worst.join('、') + '(' + mn + ' 場)。交易時同樣分數,優先換進季後賽場次多的人。</p>';
  })();

  // ---------- 2) trade analyzer ----------
  (function () {
    var host = document.getElementById('v2trade'); if (!host) return;
    host.innerHTML = '<h2>交易分析器<span class="label">最多各 3 人</span></h2>' +
      '<datalist id="tdl">' + P.map(function (p) { return '<option value="' + esc(plabel(p)) + '">'; }).join('') + '</datalist>' +
      '<div class="tradebar"><div><h4>你送出</h4>' + [0, 1, 2].map(function (i) { return '<div class="tradeslot"><input class="tout" list="tdl" placeholder="球員 ' + (i + 1) + '" autocomplete="off"></div>'; }).join('') + '</div>' +
      '<div><h4>你收到</h4>' + [0, 1, 2].map(function (i) { return '<div class="tradeslot"><input class="tin" list="tdl" placeholder="球員 ' + (i + 1) + '" autocomplete="off"></div>'; }).join('') + '</div></div>' +

      if (!A.length && !B.length) { out.innerHTML = '<p class="note">從清單選球員(各邊最多 3 人),我會算出雙方預估分數差。</p>'; return; }

        '<p class="note">位置變化:送出 ' + esc(posList(A)) + ' → 收到 ' + esc(posList(B)) + '。</p>' +
        (injB.length ? '<p class="note" style="color:var(--bad)">⚠ 收到的球員裡有傷:' + injB.map(function (p) { return esc(p.name) + '(' + esc(p.inj) + ')'; }).join('、') + '。</p>' : '') +
        '</div>';
    }
    outs.concat(ins).forEach(function (i) { i.addEventListener('input', calc); i.addEventListener('change', calc); });
    calc();
    // trade ideas (computed in build.mjs): one tap loads a row into the analyzer above
    var TI = D.tradeIdeas; if (TI) {
      var byName = {}; P.forEach(function (p) { byName[p.name] = p; });
      var box = document.createElement('div');
      box.innerHTML = '<div class="row-lbl">交易對象建議</div>' +
        (TI.weak.length ? '<p class="note">跟你自己其他位置比,最弱的是:' + TI.weak.map(function (w) { return w[0] + '(你 ' + f1(w[1]) + '、聯盟平均 ' + f1(w[2]) + ')'; }).join('、') + '。數字是該位置第 2 好球員的預估分數。</p>' : '<p class="note">你各位置強度差不多,沒有明顯弱點。</p>') +
        (TI.rows.length ? '<ul class="list">' + TI.rows.map(function (r, i) { return '<li><span><b>' + esc(r[0]) + '</b>:送 ' + esc(r[1]) + '<small> ' + esc(r[2]) + ' · ' + esc(r[3]) + ' · ' + f1(r[4]) + '</small> → 換 ' + esc(r[5]) + '<small> ' + esc(r[6]) + ' · ' + esc(r[7]) + ' · ' + f1(r[8]) + '</small><br><small class="note">補你弱的位置 +' + f1(r[9]) + ',也補他弱的位置 +' + f1(r[10]) + (r[11] ? ';季後賽場次 ' + (r[11] > 0 ? '+' : '') + r[11] : '') + '</small> <button type="button" class="tiload" data-i="' + i + '">放進分析器</button></span></li>'; }).join('') + '</ul>' : '<p class="note">目前找不到雙方都補到弱點、價值又相近的一換一。</p>') +
        '<p class="note">只列一換一、價值(今年和去年平均)相近、雙方都補到弱點的組合,不含你前 3 名和 OUT 的人,也遵守 C 最多 4 人。對方要不要換是另一回事,當作開口的起點。</p>';
      out.parentNode.insertBefore(box, out.nextSibling);
      box.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('.tiload'); if (!b) return; var r = TI.rows[+b.getAttribute('data-i')];
        var g = byName[r[1]], t = byName[r[5]]; outs.concat(ins).forEach(function (i) { i.value = ''; });
        if (g) outs[0].value = plabel(g); if (t) ins[0].value = plabel(t); calc(); host.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    }
  })();

  // ---------- 3) back-to-back fatigue risk ----------
  (function () {
    var host = document.getElementById('v2b2b'); if (!host || !D.sch) return;
    function parseSched(str) {
      return (str || '').split(';').filter(Boolean).map(function (e) { var mm = e.split(':'); var dm = mm[0].match(/(\d+)\/(\d+)/); if (!dm) return null;
        var mo = +dm[1], da = +dm[2], yr = mo >= 10 ? 2026 : 2027; var d = new Date(Date.UTC(yr, mo - 1, da));
        return { label: dm[0], opp: (mm[1] || '').replace('@', '@'), date: d }; }).filter(Boolean);
    }
    var mine = P.filter(function (p) { return p.own === 'aespa'; });
    var teams = {}; mine.forEach(function (p) { if (p.team && D.sch[p.team]) teams[p.team] = (teams[p.team] || []).concat([p.name]); });
    var rows = [];
    Object.keys(teams).forEach(function (t) {
      var sch = parseSched((D.sch[t] || [])[1]);
      for (var i = 1; i < sch.length; i++) {
        var diffDays = Math.round((sch[i].date - sch[i - 1].date) / 86400000);
        if (diffDays === 1) rows.push({ team: t, names: teams[t], d1: sch[i - 1], d2: sch[i] });
      }
    });
    rows.sort(function (a, b) { return a.d1.date - b.d1.date; });
    host.innerHTML = '<h2>背靠背疲勞風險<span class="label">你陣容球員所在球隊,近期連兩天出賽</span></h2>' +
      (rows.length ? rows.map(function (r) { return '<div class="b2britem"><span>' + esc(r.names.join('、')) + '<br><small class="note">' + esc(r.team) + '</small></span><span>' + esc(r.d1.label) + esc(r.d1.opp) + ' → ' + esc(r.d2.label) + esc(r.d2.opp) + '</span></div>'; }).join('') : '<p class="note">近期沒有背靠背。</p>') +
      '<p class="note">背靠背(連續兩天出賽)對分數的實際影響,用這聯盟自己的資料回測過,看不出第二場會比較低分(甚至略高),所以不宜當成一定會變差;這裡單純標出有背靠背的人,是否要調整先發自行判斷。</p>';
  })();

  // ---------- 4) positional scarcity ----------
  (function () {
    var host = document.getElementById('v2scarcity'); if (!host) return;
    var FA = P.filter(function (p) { return (p.own === 'FA' || p.own === 'Waiver') && est(p) != null; });
    var POS = ['PG', 'SG', 'SF', 'PF', 'C'];
    var byPos = {}; POS.forEach(function (k) { byPos[k] = []; });
    FA.forEach(function (p) { (p.pos || '').split('/').forEach(function (k) { if (byPos[k]) byPos[k].push(p); }); });
    POS.forEach(function (k) { byPos[k].sort(function (a, b) { return est(b) - est(a); }); });
    var cards = POS.map(function (k) { var list = byPos[k], deep = list.filter(function (p) { return est(p) >= 15; }).length;
      return '<div class="scarcard"><h4>' + k + '<span class="cnt">' + deep + ' 人可補(≥15分)</span></h4><ul>' +
        list.slice(0, 3).map(function (p) { return '<li>' + esc(p.name) + '<span class="note"> ' + f1(est(p)) + '</span></li>'; }).join('') + (!list.length ? '<li class="note">目前沒有</li>' : '') + '</ul></div>'; }).join('');
    var rank = POS.map(function (k) { return { k: k, n: byPos[k].filter(function (p) { return est(p) >= 15; }).length }; }).sort(function (a, b) { return a.n - b.n; });
    host.innerHTML = '<h2>位置稀缺度<span class="label">自由市場各位置還有誰</span></h2><div class="scargrid">' + cards + '</div>' +
      '<p class="note">目前最難補的位置:' + rank.slice(0, 2).map(function (r) { return r.k + '(' + r.n + ' 人)'; }).join('、') + '。只計算自由球員與 waiver,多位置資格的球員會在每個位置都算到。</p>';
  })();

  // ---------- 5) playoff positioning + league power ranking / weekly trend chart ----------
  (function () {
    var host = document.getElementById('v2playoff'); if (!host || !D.v2 || !D.v2.standings) return;
    var V = D.v2, cut = V.playoffTeamCount || 8;
    var rows = V.standings.map(function (s, i) { var inPlayoff = s.projRank != null && s.projRank <= cut;
      return '<div class="standrow ' + (s.name === 'aespa' ? 'me' : '') + (i + 1 === cut ? ' cut' : '') + '"><span class="seed">' + (s.seed || (i + 1)) + '</span><span><b>' + esc(s.name) + '</b></span><span class="n">' + s.w + '-' + s.l + '</span><span class="n">' + s.pf + '</span><span class="chip ' + (inPlayoff ? 'c-ok' : 'c-drop') + '">ESPN預測第' + (s.projRank || '?') + '名</span></div>'; }).join('');
    function trendChart() {
      var tr = V.trend; if (!tr || !tr.weeks || !tr.weeks.length) return '';
      var opp = (D.insights && D.insights.win && D.insights.win.this && D.insights.win.this.opp) || null;
      var me = tr.scores['aespa'] || [], op = opp && tr.scores[opp] ? tr.scores[opp] : null, med = tr.median || [];
      var all = [].concat(me, med, op || []).filter(function (v) { return v != null; }); if (!all.length) return '';
      var max = Math.max.apply(null, all), min = Math.min.apply(null, all);
      var W = 600, H = 160, pad = 24;
      function x(i) { return pad + i * (W - 2 * pad) / Math.max(tr.weeks.length - 1, 1); }
      function y(v) { return H - pad - (v - min) * (H - 2 * pad) / Math.max(max - min, 1); }
      function ln(arr) { var pts = []; arr.forEach(function (v, i) { if (v != null) pts.push(x(i) + ',' + y(v)); }); return pts.length > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke-width="2.5"></polyline>' : ''; }
      function dots(arr) { var s = ''; arr.forEach(function (v, i) { if (v != null) s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3"></circle>'; }); return s; }
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="trendsvg" role="img" aria-label="每週得分走勢">' +
        '<g class="med">' + ln(med) + dots(med) + '</g>' + (op ? '<g class="opp">' + ln(op) + dots(op) + '</g>' : '') + '<g class="me">' + ln(me) + dots(me) + '</g>' +
        tr.weeks.map(function (w, i) { return '<text x="' + x(i) + '" y="' + (H - 4) + '" class="wl">W' + w + '</text>'; }).join('') + '</svg>';
      return '<div class="row-lbl" style="margin-top:14px">每週得分走勢<span class="label">你 vs ' + esc(opp || '目前對手') + ' vs 聯盟中位數</span></div>' + svg +
        '<p class="note"><span class="lgd me">●</span>你　<span class="lgd opp">●</span>' + esc(opp || '') + '　<span class="lgd med">●</span>聯盟中位數</p>';
    }
    host.innerHTML = '<h2>戰力排名 · 季後賽卡位<span class="label">目前第 ' + (V.curWeek || '?') + ' 週,共 ' + (V.regWeeks || '?') + ' 週例行賽</span></h2>' + rows +
      '<p class="note">虛線以上是戰績排名前 ' + cut + ' 名(晉級名額)。「ESPN預測第 N 名」是 ESPN 官方依戰力算的預測最終名次,不是我自己算的機率;綠色代表目前預測會晉級,紅色代表預測會被擠出去。剩餘約 ' + Math.max((V.regWeeks || 0) - (V.curWeek || 0), 0) + ' 週例行賽還會變動。</p>' + trendChart();
  })();

  // ---------- 6) league-wide future opponents ----------
  (function () {
    var host = document.getElementById('v2future'); if (!host || !D.v2 || !D.v2.future) return;
    var V = D.v2, today = new Date();
    function dateFor(w) { var d = new Date(today.getTime() + (w - (V.curWeek || w)) * 7 * 86400000); return (d.getMonth() + 1) + '/' + d.getDate(); }
    var sosVals = []; Object.keys(V.future).forEach(function (k) { V.future[k].forEach(function (x) { if (x.sos != null) sosVals.push(x.sos); }); });
    sosVals.sort(function (a, b) { return a - b; });
    var avgSos = sosVals.length ? sosVals.reduce(function (a, b) { return a + b; }, 0) / sosVals.length : null;
    function cls(sos) { if (avgSos == null || sos == null) return ''; return sos >= avgSos + 150 ? 'hard' : sos <= avgSos - 150 ? 'soft' : ''; }
    function block(name, list) {
      return '<div class="trendrow" style="grid-template-columns:140px 1fr"><div class="nm">' + esc(name) + '</div><div class="futgrid">' +
        list.map(function (x) { return '<span class="' + cls(x.sos) + '" title="對手平均每週得分約 ' + f1(x.sos) + '">第' + x.w + '週 約' + dateFor(x.w) + '<br>' + esc(x.opp) + '</span>'; }).join('') + '</div></div>';
    }
    var mine = V.future['aespa'];
    var others = Object.keys(V.future).filter(function (k) { return k !== 'aespa'; }).sort();
    host.innerHTML = '<h2>全聯盟未來對手<span class="label">未來 6 週</span></h2>' +
      (mine ? block('aespa(你)', mine) : '') +
      '<details style="margin-top:10px"><summary class="note" style="cursor:pointer">看其他隊的未來對手</summary>' + others.map(function (k) { return block(k, V.future[k]); }).join('') + '</details>' +
      '<p class="note">日期是用「現在時間」往後推算的大略日期,不是 ESPN 原始日期。紅色標籤代表那位對手近期平均得分較高(較硬),綠色代表較軟,方便你判斷現在該衝戰績還是該養傷。</p>';
  })();
} catch (e) {} })();
</script>

<script>
(function () { try {
  // Make "今天要做的事" (and the auto-rewritten block) a real checklist: click to strike through, remembered per browser until the content changes.
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return String(h); }
  var KEY = 'aespa_todo_done';
  var done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { done = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
  function wire(li) {
    if (li.querySelector('.chk')) return;
    var key = hash(li.textContent.trim());
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'chk'; cb.checked = !!done[key];
    if (done[key]) li.classList.add('done');
    cb.addEventListener('change', function () {
      done[key] = cb.checked; save(); li.classList.toggle('done', cb.checked);
      if (cb.checked && li.parentNode) li.parentNode.appendChild(li); // 打勾後折疊並移到清單最下面
    });
    li.insertBefore(cb, li.firstChild);
    // description collapsed by default; click the title to expand/collapse (separate from the checkbox)
    var b = li.querySelector('b');
    if (b) { b.style.cursor = 'pointer'; b.addEventListener('click', function () { li.classList.toggle('open'); }); }
  }
  function sinkDone() {
    Array.prototype.forEach.call(document.querySelectorAll('#todo ol'), function (ol) {
      Array.prototype.slice.call(ol.children).filter(function (li) { return li.classList.contains('done'); }).forEach(function (li) { ol.appendChild(li); });
    });
  }
  function wireAll() { Array.prototype.forEach.call(document.querySelectorAll('#todo ol > li'), wire); sinkDone(); }
  wireAll();
  window.__wireTodoAll = wireAll;
  // the auto-整理 items and stale-marker scripts inject/modify the DOM slightly after this script runs; re-check shortly after load.
  setTimeout(wireAll, 200); setTimeout(wireAll, 800);
} catch (e) {} })();
</script>

<script>
// Fold any panel by tapping its title. Low-urgency panels on the 決策 tab start folded; a viewer's
// own choice per panel is remembered on this device (localStorage, best effort).
(function () { try {
  var DEF = { weekreport: 1, oppstream: 1, v2b2b: 1, cmp: 1 }, KEY = 'aespa-fold', st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function mark(sec) { var h = sec.querySelector(':scope > h2'); if (h) h.classList.add('foldable'); }
  document.querySelectorAll('.pane > section.panel[id]').forEach(function (sec) {
    var id = sec.id, f = st[id] != null ? st[id] : DEF[id]; if (f) sec.classList.add('fold'); mark(sec);
    new MutationObserver(function () { mark(sec); }).observe(sec, { childList: true });
    sec.addEventListener('click', function (e) { var h = e.target.closest && e.target.closest('h2'); if (!h || h.parentNode !== sec) return;
      sec.classList.toggle('fold'); st[id] = sec.classList.contains('fold') ? 1 : 0; save(); });
  });
} catch (e) {} })();
