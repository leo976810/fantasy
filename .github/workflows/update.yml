name: update-data
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths: ['data.json', 'build.mjs', 'update.mjs', 'gate.mjs']
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: gate
        run: node gate.mjs
      - if: steps.gate.outputs.run == 'true'
        run: node update.mjs
      - if: steps.gate.outputs.run == 'true'
        run: node build.mjs
      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json v2/index.html
          git diff --cached --quiet || git commit -m "Auto-update data.json and index.html"
          git pull --rebase origin main
          git push
