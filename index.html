<!doctype html><html lang="zh-Hant"><head><title>AESPA 直連測試</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Layout: one narrow column, a status banner on top, then the raw proof underneath. */
:root {
  --bg: #f4f5f7; --fg: #14181f; --muted: #5b6573; --line: #d9dde3; --card: #ffffff;
  --ok: #0f7a4a; --ok-soft: #dff3e8; --bad: #b3261e; --bad-soft: #fbe3e1; --wait: #8a6100; --wait-soft: #fbefc9;
  --f-body: "Noto Sans TC", system-ui, sans-serif; --f-num: "Barlow Condensed", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --fg: #e8ebf0; --muted: #9aa4b2; --line: #2b323d; --card: #1a1f27;
  --ok: #5fd39a; --ok-soft: #14301f; --bad: #ff8f86; --bad-soft: #3a1815; --wait: #f1c75b; --wait-soft: #33290d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e8ebf0; --muted: #9aa4b2; --line: #2b323d; --card: #1a1f27;
  --ok: #5fd39a; --ok-soft: #14301f; --bad: #ff8f86; --bad-soft: #3a1815; --wait: #f1c75b; --wait-soft: #33290d; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; min-width: 0; }
h1 { font-size: 22px; margin: 0; text-wrap: balance; }
p { margin: 0; line-height: 1.6; color: var(--muted); font-size: 14px; }
.banner { border-radius: 8px; padding: 14px 16px; font-weight: 700; font-size: 16px; background: var(--wait-soft); color: var(--wait); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner small { display: block; font-weight: 400; margin-top: 4px; font-size: 13px; line-height: 1.5; word-break: break-word; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: .04em; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { font-family: var(--f-num); font-size: 18px; }
button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; justify-self: start; }
button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">

</head><body><main>
  <h1>AESPA 直連測試</h1>
  <p>這一頁在你的瀏覽器裡直接讀 ESPN 公開聯盟資料,不經過我、也不用你登入。下面顯示讀得到還是被擋。</p>
  <div id="banner" class="banner">讀取中…</div>
  <div class="scroll"><table><thead><tr><th>隊伍</th><th class="n">戰績</th><th class="n">總得分</th></tr></thead><tbody id="rows"><tr><td colspan="3">尚無資料</td></tr></tbody></table></div>
  <button id="again" type="button">重新讀取</button>
  <p id="note"></p>
</main>

<script>
(function () {
  var URL_ = 'https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/2027/segments/0/leagues/406470928?view=mTeam';
  var b = document.getElementById('banner'), rows = document.getElementById('rows'), note = document.getElementById('note');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function run() {
    b.className = 'banner'; b.textContent = '讀取中…'; note.textContent = '';
    fetch(URL_, { credentials: 'omit' }).then(function (r) {
      if (!r.ok) throw new Error('ESPN 回應 HTTP ' + r.status + (r.status === 401 ? '(聯盟還不是公開,或需要登入)' : ''));
      return r.json();
    }).then(function (d) {
      var t = (d.teams || []).slice().sort(function (x, y) { return y.record.overall.wins - x.record.overall.wins || y.record.overall.pointsFor - x.record.overall.pointsFor; });
      if (!t.length) throw new Error('有回應,但沒有球隊資料');
      b.className = 'banner ok'; b.innerHTML = '可以直連<small>讀到 ' + t.length + ' 隊,資料時間 ' + new Date().toLocaleString('zh-TW') + '</small>';
      rows.innerHTML = t.map(function (x) {
        var o = x.record.overall;
        return '<tr><td>' + esc(x.name || ((x.location || '') + ' ' + (x.nickname || ''))) + '</td><td class="n">' + o.wins + '-' + o.losses + '</td><td class="n">' + Math.round(o.pointsFor) + '</td></tr>';
      }).join('');
    }).catch(function (e) {
      b.className = 'banner bad'; b.innerHTML = '讀不到<small>' + esc(e && e.message ? e.message : e) + '</small>';
      note.textContent = '如果訊息是 Failed to fetch,通常是頁面的安全規則不允許連到 ESPN,或 ESPN 沒有開放跨網站讀取。';
    });
  }
  document.getElementById('again').addEventListener('click', run);
  run();
})();
</script>
</body></html>
