<title>AESPA 日報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: scoreboard, today-actions panel, then tabs (戰況 / 陣容與增補 / 消息 / 更新紀錄). */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e6eaf0;
  --fg: #141d29;
  --muted: #5b6676;
  --line: #d3d9e2;
  --accent: #2457f5;
  --accent-soft: #dfe7ff;
  --good: #14804a;
  --good-soft: #d9f2e4;
  --warn: #9a6200;
  --warn-soft: #fbecc9;
  --bad: #b3261e;
  --bad-soft: #fadbd8;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #17202c; --surface-2: #202b3a; --fg: #e8edf4; --muted: #96a2b4; --line: #2b3748;
    --accent: #7c9bff; --accent-soft: #1f2d5c; --good: #4cc98a; --good-soft: #14352a; --warn: #e5b34d; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3e1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #17202c; --surface-2: #202b3a; --fg: #e8edf4; --muted: #96a2b4; --line: #2b3748;
  --accent: #7c9bff; --accent-soft: #1f2d5c; --good: #4cc98a; --good-soft: #14352a; --warn: #e5b34d; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3e1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.label { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }

/* scoreboard */
.board { background: var(--fg); color: var(--bg); border-radius: 10px; padding: 18px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: center; }
.board .top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.board h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: 0.02em; }
.board .sub { font-size: 13px; opacity: 0.75; }
.score { display: flex; align-items: center; gap: 18px; }
.team { text-align: center; min-width: 0; }
.team .pts { font-size: 52px; font-weight: 700; line-height: 1; }
.team .nm { font-size: 13px; opacity: 0.8; }
.vs { font-family: var(--font-display); font-size: 18px; opacity: 0.6; }
.lead { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; border-top: 1px solid rgba(128,140,160,0.35); padding-top: 12px; }
.lead b { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.02em; }

/* desk */
.desk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel h2 .label { font-weight: 400; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.act li{margin:2px 0}.act .d{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}.act ul{list-style:none;padding:0;margin:8px 0;font-size:13.5px;line-height:1.6}.act .me b{color:var(--fg)}
.dayc{cursor:pointer}.dayc:hover{background:var(--surface-2)}.chev{color:var(--muted);margin-left:4px}
.plb{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;border-bottom:1px dotted var(--muted)}.plb:hover{color:var(--accent,var(--fg))}
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#mdl.on{display:flex}
#mdl .box{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:16px}
#mdl .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}#mdl .mh h3{margin:0;font-size:18px}#mdl .x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
#mdl .sub{color:var(--muted);font-size:13px;margin:6px 0 10px}#mdl table{width:100%;border-collapse:collapse;font-size:13.5px}#mdl th,#mdl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}#mdl th{color:var(--muted);font-weight:500;font-size:12px}#mdl .n{text-align:right;font-variant-numeric:tabular-nums}
#mdl .tg{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--surface-2);color:var(--muted)}#mdl .tg.x{background:rgba(220,60,60,.18);color:var(--bad)}#mdl .tot td{font-weight:700}#mdl .inj{display:inline-block;margin:4px 0 8px;font-size:12px;color:var(--bad);background:rgba(220,60,60,.15);border-radius:4px;padding:2px 8px}
.newb{font-size:10px;background:#f5a623;color:#2b1a00;border-radius:4px;padding:0 5px;margin-left:5px;font-weight:700;vertical-align:middle}
.hl{outline:2px solid #f5a623;outline-offset:2px;position:relative}.hl.panel::after{content:"NEW";position:absolute;top:-10px;right:12px;background:#f5a623;color:#2b1a00;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px}
td.hl{background:rgba(245,166,35,.16)}
.hlnote{background:rgba(245,166,35,.16);border:1px solid #f5a623;border-radius:8px;padding:8px 12px;font-size:13px}
.prob{display:flex;gap:12px;flex-wrap:wrap}.pbox{flex:1 1 240px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}.pbox .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}.bar{height:8px;border-radius:4px;background:var(--bad-soft);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--good)}
.lu{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}.trd{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13.5px}.trd>div{flex:1}.trd .arr{flex:0 0 auto;color:var(--muted);font-size:20px}.tn{font-weight:600}.lu .t{font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}.sl{display:inline-block;min-width:38px;font-size:11px;color:var(--muted)}
.schd.hl{padding:6px;border-radius:8px;margin-top:10px}.schd .up{color:var(--good)}.schd .down{color:var(--bad)}.stg{display:inline-block;font-size:11px;border-radius:99px;padding:0 7px;margin-left:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:600}.stg.up{background:var(--good-soft);color:var(--good)}.stg.down{background:var(--bad-soft);color:var(--bad)}.ana{margin:10px 0}.ana.hl{padding:8px;border-radius:8px}.ana .ah{font-weight:700;font-size:15px;margin-bottom:4px}.ana .ah.up{color:var(--good)}.ana .ah.down{color:var(--bad)}.ana .ah.warn{color:var(--warn)}.ana ul{margin:4px 0 8px;padding-left:18px}.ana li{margin:2px 0;font-size:13px}.lud summary{cursor:pointer;color:var(--accent);margin:8px 0}.fainj{margin-top:12px}.fainj.hl{padding:8px;border-radius:8px}.sched span.hl{outline:none;outline-offset:0}.sched span .tl{margin-right:3px}.tscore{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin:8px 0}.tscore b{font-family:var(--font-display);font-size:30px}.tscore b.g{color:var(--good)}.tscore small{color:var(--muted)}.twarn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tcol{min-width:0}.tcol h3{font-size:15px;margin-bottom:4px}.thd{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:2px 0}.tr{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}.tr.off{opacity:.5}.tr b{font-size:14px;font-weight:600}.tr small{display:block;color:var(--muted);font-size:12px}.tr .ts{font-family:var(--font-display);font-size:16px;color:var(--muted)}.tc{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px}.tc.bad{background:var(--bad-soft);color:var(--bad)}
.tgrid{display:block}.ghd{display:grid;grid-template-columns:1fr 38px 1fr;font-size:14px;margin-bottom:4px}.ghd{align-items:end;margin:6px 0}.ghd>div{text-align:center}.ghd b{white-space:nowrap;text-align:center;display:block}.hs{display:block;font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}.hs.g{color:var(--good)}.tcnt{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}.gr .pc.off .pi b{color:var(--muted);opacity:.6;font-weight:500}.tscore{justify-content:center}.twarn{text-align:center}.gr.tot .pc{justify-content:center}.gr.tot .pc.r{justify-content:center}.gr{display:grid;grid-template-columns:1fr 38px 1fr;border-bottom:1px solid var(--line);min-height:50px}.gr .pc{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 2px;min-width:0}.gr .pc.r{flex-direction:row}.gr .pi{min-width:0}.gr .pc.r .pi{text-align:right}.gr .pi b{font-size:13px;font-weight:600;display:inline}.gr .pi small{display:block;color:var(--muted);font-size:11px;white-space:nowrap}.gs{display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted)}.ps{color:var(--muted);font-family:var(--font-display);font-size:15px;min-width:14px;text-align:center}.ps.big{font-size:20px;color:var(--fg)}.gr.tot{min-height:44px}.tl{width:16px;height:16px;vertical-align:-3px;margin-right:2px;object-fit:contain}.retd{display:inline-block;font-size:11px;border-radius:99px;padding:0 7px;margin-left:6px;background:var(--bad-soft);color:var(--bad);white-space:nowrap;font-weight:600}.retd.hl{outline-offset:1px}
.cmpbar{display:flex;gap:8px;align-items:center;margin:8px 0}.cmpbar input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px}.cmpbar button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:16px;cursor:pointer}
.cmpsent{font-size:17px;margin:10px 0}.cmpt{width:100%}.cmpt th:first-child,.cmpt tbody th{text-align:left;color:var(--muted);font-weight:500;white-space:nowrap}.cmpt td,.cmpt thead th{text-align:center}.cmpt td.win{background:var(--good-soft);color:var(--good);font-weight:700}.cmpt td.bad{color:var(--bad)}.cmpt small.up{color:var(--good)}.cmpt small.down{color:var(--bad)}.cmpt .plb{font-weight:700}
.sortable{cursor:pointer;user-select:none}.sortable i{font-style:normal;color:var(--muted);margin-left:2px;font-size:11px}.sortable.on i{color:var(--accent)}.injn{display:block;color:var(--bad);white-space:normal;max-width:220px}
th.hl{background:rgba(245,166,35,.28)}
.callout { background: var(--warn-soft); color: var(--fg); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; }

.games { display: flex; flex-wrap: wrap; gap: 8px; }
.game { background: var(--surface-2); border-radius: 6px; padding: 8px 12px; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
.game small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.scroll { overflow-x: auto; }
th { text-align: left; font-size: 11.5px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { font-weight: 500; white-space: nowrap; }
td.name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.fp { font-family: var(--font-display); font-size: 18px; font-weight: 700; }

.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.c-core { background: var(--accent-soft); color: var(--accent); }
.c-ok { background: var(--good-soft); color: var(--good); }
.c-watch { background: var(--warn-soft); color: var(--warn); }
.c-drop { background: var(--bad-soft); color: var(--bad); }
.c-ir { background: var(--surface-2); color: var(--muted); }
.days { display: inline-flex; gap: 3px; }
.d { width: 24px; text-align: center; font-size: 11px; border-radius: 4px; padding: 1px 0; background: var(--surface-2); color: var(--muted); }
.d.on { background: var(--accent); color: var(--surface); font-weight: 700; }
.up { color: var(--good); } .down { color: var(--bad); }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
ul.list li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
.t-out { background: var(--bad-soft); color: var(--bad); }
.t-dtd { background: var(--warn-soft); color: var(--warn); }
.t-ok { background: var(--good-soft); color: var(--good); }
.who { font-weight: 700; }

.pick { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
.pick.first { border-color: var(--accent); background: var(--accent-soft); }
.pick .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.pick .hd b { font-size: 16px; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.stat { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot { color: var(--muted); font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.sched { display: flex; flex-wrap: wrap; gap: 6px; }
.sched span { background: var(--surface-2); border-radius: 4px; padding: 1px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.row-lbl { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 860px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: 1fr; }
  .team .pts { font-size: 44px; }
}

.sched span.hl { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ret { font-family: var(--font-display); font-size: 16px; font-weight: 600; white-space: nowrap; }
ul.list.inj li { grid-template-columns: auto 1fr auto; }
@media (max-width: 520px) { ul.list.inj li { grid-template-columns: auto 1fr; } ul.list.inj li .ret { grid-column: 2; } }
.src a { color: var(--accent); font-weight: 600; text-decoration: none; }
.src a:hover { text-decoration: underline; }
.src small { color: var(--muted); }
table.mx td.hi { color: var(--accent); font-weight: 700; }

.pane { display: flex; flex-direction: column; gap: 20px; }
.pane[hidden] { display: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 700; font-size: 14px; background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.todo { border-color: var(--accent); }
.todo ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: n; }
.todo li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.todo li b { display: block; font-size: 15px; }
.todo li span.d2 { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); font-weight: 400; }
.pc { color: var(--muted); font-size: 11px; font-weight: 400; }
.small, table.small { font-size: 12px; }
table.small td, table.small th { padding: 4px 8px; }
.row-lbl.small { margin-top: 6px; color: var(--muted); }
.tm { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; }
.tm .hd { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tm .hd b { font-size: 16px; }
.tm p { margin: 0; font-size: 13.5px; }
.tm .lbl { color: var(--muted); font-size: 12px; margin-right: 6px; }
.tms { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
td .chip { white-space: normal; display: inline-block; border-radius: 6px; line-height: 1.4; }
details.tm > summary { cursor: pointer; list-style: none; display: grid; gap: 6px; }
details.tm > summary::-webkit-details-marker { display: none; }
details.tm > summary .more { color: var(--accent); font-size: 12.5px; font-weight: 700; }
details.tm[open] > summary .more::after { content: ' ▲'; }
details.tm:not([open]) > summary .more::after { content: ' ▼'; }
details.tm .body { display: grid; gap: 8px; margin-top: 8px; }
.tms.one { grid-template-columns: minmax(0, 1fr); }

.board { position: relative; padding-right: 64px; }
.themebtn { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; display: grid; place-items: center; opacity: 0.85; padding: 0; }
.themebtn:hover { opacity: 1; }
.themebtn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.themebtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<div class="wrap" id="app">
  <header class="board">
    <div>
      <div class="top"><h1>AESPA 日報</h1><span class="sub" id="asof"></span></div>
      <div class="sub" id="leagueline"></div>
    </div>
    <div class="score" id="score"></div>
    <div class="lead" id="lead"></div>
    <button class="themebtn" id="themebtn" type="button"></button>
  </header>

  <section class="panel todo" id="todo"></section>

  <nav class="tabs" role="tablist" aria-label="日報分頁">
    <button role="tab" data-tab="war" aria-selected="true">戰況</button>
    <button role="tab" data-tab="dec" aria-selected="false">決策<span class="newb">NEW</span></button>
    <button role="tab" data-tab="team" aria-selected="false">陣容與增補</button>
    <button role="tab" data-tab="league" aria-selected="false">聯盟成員</button>
    <button role="tab" data-tab="news" aria-selected="false">消息</button>
    <button role="tab" data-tab="log" aria-selected="false">更新紀錄</button>
  </nav>

  <div class="pane" id="pane-war">
    <section class="panel" id="mdays"></section>
    <section class="panel" id="recap"></section>
    <section class="panel" id="sched"></section>
  </div>
  <div class="pane" id="pane-dec" hidden>
    <div class="hlnote" id="hlnote"></div>
    <section class="panel" id="dwin" hidden style="display:none"></section>
    <section class="panel" id="dlu"></section>
    <section class="panel" id="dinj"></section>
    <section class="panel" id="dhot"></section>
    <section class="panel" id="dopp" hidden style="display:none"></section>
    <section class="panel" id="dtr" hidden style="display:none"></section>
    <section class="panel" id="cmp"></section>
  </div>
  <div class="pane" id="pane-team" hidden>
    <section class="panel" id="roster"></section>
    <section class="panel" id="picks"></section>
    <section class="panel" id="stream"></section>
    <section class="panel" id="sleep"></section>
  </div>
  <div class="pane" id="pane-league" hidden>
    <section class="panel" id="league"></section>
  </div>
  <div class="pane" id="pane-news" hidden>
    <section class="panel" id="inj"></section>
    <section class="panel" id="threads"></section>
  </div>
  <div class="pane" id="pane-log" hidden>
    <section class="panel" id="chg"></section>

    return '<div class="ghd"><div><span class="hs g">' + f1(tot(T.me)) + '</span><b>' + esc(T.meName || 'aespa') + '</b></div><span></span><div><span class="hs">' + f1(tot(T.op)) + '</span><b>' + esc(T.opName) + '</b></div></div>' + rows;
  }
  function render(T, live) {
    var act = function (r) { return r.slot !== 12 && r.slot !== 13 && r.ms != null; }, sum = function (a) { return a.filter(act).reduce(function (s, r) { return s + (r.pts || 0); }, 0); };
    var n = function (a) { return a.filter(function (r) { return r.slot !== 13 && r.ms != null; }).length; };
    var warn = T.me.filter(function (r) { return act(r) && r.inj; }).sort(function (a, b) { return a.ms - b.ms; });
    host.innerHTML = '<h2><span>今天的比賽<small class="tcnt">(你 ' + n(T.me) + ' 人有比賽,對手 ' + n(T.op) + ' 人)</small></span><span class="label">' + esc(T.label) + ',時間是台北時間</span></h2>' +
      (warn.length ? '<div class="twarn">⚠ 開打前留意:' + warn.map(function (r) { return esc(r.name) + '(' + r.inj + ',' + tm(r.ms) + ' 開打)'; }).join('、') + '。如果開打前確定不能打,記得換人。</div>' : '') +
      '<div class="tgrid">' + grid(T) + '</div>' +
      '<p class="note">' + (live ? '網頁開著時每 2 分鐘自動更新分數。' : '這裡是快照(' + new Date(T.ts).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }) + ');GitHub 版網頁開著時每 2 分鐘自動更新分數。') + '標「替補」的是 ESPN 上今天排在替補、不會算分的人;IR 同樣不算分。</p>';
  }
  render(D.today, false);
  if (/github\.io$/.test(location.hostname)) {
    var tick = function () { fetchToday(D.today.meName).then(function (T) { render(T, true); }).catch(function () {}); };
    tick(); setInterval(tick, 120000);
  }
})();
</script>
<script>
(function () {
  var btn = document.getElementById('themebtn'); if (!btn) return;
  var root = document.documentElement;
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function current() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paint() { var d = current() === 'dark'; btn.innerHTML = d ? SUN : MOON; btn.setAttribute('aria-label', d ? '切換成淺色模式' : '切換成深色模式'); btn.title = btn.getAttribute('aria-label'); }
  try { var sv = localStorage.getItem('aespaTheme'); if (sv === 'dark' || sv === 'light') root.setAttribute('data-theme', sv); } catch (e) {}

    var n = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', n);
    try { localStorage.setItem('aespaTheme', n); } catch (e) {}

  });
